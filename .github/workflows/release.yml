name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify release tag matches VERSION, Cargo.toml, and package.json
        run: python3 scripts/release-version.py check --tag "${GITHUB_REF_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/niu-io/niu:${{ github.ref_name }}
            ghcr.io/niu-io/niu:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release with installer assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            compose.yaml \
            scripts/install.sh \
            config/niu.example.toml \
            --title "Niu ${GITHUB_REF_NAME}" \
            --generate-notes
