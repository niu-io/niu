name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  github-release:
    name: Publish GitHub Release & Notes
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository with full history and tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Refuse replacement of an existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release-guard.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit "$(git rev-parse HEAD)"

      - name: Generate structured Release Notes
        run: python3 scripts/release-version.py notes --tag "${GITHUB_REF_NAME}" --output /tmp/release-notes.md

      - name: Set up Node for the standalone MCP package
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build and package the MCP client
        working-directory: sdks/mcp
        run: |
          npm install --ignore-scripts --package-lock=false
          npm run build
          mkdir -p /tmp/mcp-release
          npm pack --pack-destination /tmp/mcp-release
          mkdir -p /tmp/niu-release
          cp "$GITHUB_WORKSPACE/compose.yaml" "$GITHUB_WORKSPACE/scripts/install.sh" "$GITHUB_WORKSPACE/config/niu.example.toml" /tmp/niu-release/
          cp /tmp/mcp-release/*.tgz /tmp/niu-release/
          git rev-parse HEAD > /tmp/niu-release/SOURCE_COMMIT
          cd /tmp/niu-release
          sha256sum compose.yaml install.sh niu.example.toml *.tgz SOURCE_COMMIT > SHA256SUMS

      - name: Publish a new GitHub Release with immutable assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/release-guard.py --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --commit "$(git rev-parse HEAD)"
          printf '\nSource commit: `%s`. See SOURCE_COMMIT and SHA256SUMS for asset provenance.\n' "$(git rev-parse HEAD)" >> /tmp/release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            /tmp/niu-release/* \
            --verify-tag \
            --title "Niu ${GITHUB_REF_NAME}" \
            --notes-file /tmp/release-notes.md
