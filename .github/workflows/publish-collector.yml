name: Publish collector to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Collector version to publish (must match package.json)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-collector
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'niu-io/niu' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/agent-observability
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify release version and plugin manifests
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const pkg = read('package.json');
          assert.equal(pkg.name, '@niu-io/collector');
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(pkg.version, process.env.RELEASE_VERSION);
          for (const path of ['plugin.json', '.codex-plugin/plugin.json']) {
            assert.equal(read(path).version, pkg.version, `${path} version mismatch`);
          }
          JS
      - name: Check syntax and test metadata collection
        run: |
          npm run check
          npm test
      - name: Pack release archive
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm publish dist/*.tgz --access public --dry-run --ignore-scripts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collector-package
          path: sdks/agent-observability/dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collector-package
          path: release
      - name: Publish verified archive with npm trusted publishing
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (!(a>11 || (a===11 && (b>5 || (b===5 && c>=1))))) throw Error("npm 11.5.1 or newer is required for trusted publishing")' "$(npm --version)"
          archive="release/niu-io-collector-${RELEASE_VERSION}.tgz"
          test -f "$archive"
          npm publish "$archive" --access public --provenance --ignore-scripts --registry https://registry.npmjs.org
          expected=$(sha1sum "$archive" | cut -d ' ' -f 1)
          for attempt in 1 2 3 4 5; do
            actual=$(npm view "@niu-io/collector@${RELEASE_VERSION}" dist.shasum --registry https://registry.npmjs.org 2>/dev/null || true)
            if [ "$actual" = "$expected" ]; then
              printf 'Published @niu-io/collector@%s; registry archive verified.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 5
          done
          echo 'Registry archive verification failed.' >&2
          exit 1
