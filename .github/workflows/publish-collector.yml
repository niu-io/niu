name: Publish collector to npm

on:
  pull_request:
    paths:
      - .github/workflows/publish-collector.yml
      - sdks/agent-observability/**
  push:
    branches: [main]
    tags: [collector-v*]
    paths:
      - .github/workflows/publish-collector.yml
      - sdks/agent-observability/**

permissions:
  contents: read

concurrency:
  group: collector-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: github.repository == 'niu-io/niu' && github.event.deleted != true
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sdks/agent-observability
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Verify tagged commit belongs to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify release version and plugin manifests
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync, readFileSync } from 'node:fs';
          import assert from 'node:assert/strict';
          import { version as collectorVersion } from './src/telemetry.mjs';
          const read = path => JSON.parse(readFileSync(path, 'utf8'));
          const pkg = read('package.json');
          assert.equal(pkg.name, '@niu-io/collector');
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(collectorVersion, pkg.version, 'Telemetry version mismatch');
          if (process.env.RELEASE_REF.startsWith('refs/tags/')) {
            assert.equal(process.env.RELEASE_REF, `refs/tags/collector-v${pkg.version}`, 'Tag must match the collector version');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${pkg.version}\n`);
          for (const path of ['plugin.json', '.codex-plugin/plugin.json']) {
            assert.equal(read(path).version, pkg.version, `${path} version mismatch`);
          }
          JS
      - name: Check syntax and test metadata collection
        run: |
          npm run check
          npm test
      - name: Pack release archive
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
          npm pack ./dist/*.tgz --dry-run --offline --ignore-scripts
          npm install --prefix "$RUNNER_TEMP/collector-install" --no-package-lock --ignore-scripts --no-audit --no-fund ./dist/*.tgz
          NIU_COLLECTOR_HOME="$RUNNER_TEMP/collector-smoke" "$RUNNER_TEMP/collector-install/node_modules/.bin/niu-collector" status
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: collector-package
          path: sdks/agent-observability/dist/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.event.created && startsWith(github.ref, 'refs/tags/collector-v')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: collector-package
          path: release
      - name: Publish verified archive with npm trusted publishing
        env:
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); if (!(a>11 || (a===11 && (b>5 || (b===5 && c>=1))))) throw Error("npm 11.5.1 or newer is required for trusted publishing")' "$(npm --version)"
          archive="./release/niu-io-collector-${RELEASE_VERSION}.tgz"
          test -f "$archive"
          expected=$(sha1sum "$archive" | cut -d ' ' -f 1)
          registry_checksum() {
            npm view "@niu-io/collector@${RELEASE_VERSION}" dist.shasum --registry https://registry.npmjs.org --fetch-retries=0 --fetch-timeout=10000 2>/dev/null || true
          }
          actual=$(registry_checksum)
          if [ -z "$actual" ]; then
            npm publish "$archive" --access public --provenance --ignore-scripts --registry https://registry.npmjs.org
          fi
          # npm scans new versions before making them installable. Allow 20 minutes.
          deadline=$((SECONDS + 1200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            actual=$(registry_checksum)
            if [ "$actual" = "$expected" ]; then
              printf 'Published @niu-io/collector@%s; registry archive verified.\n' "$RELEASE_VERSION" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [ -n "$actual" ]; then
              echo 'The registry contains a different archive for this version; refusing to overwrite it.' >&2
              exit 1
            fi
            echo 'Waiting for npm publish-time scanning and registry availability...'
            sleep 10
          done
          echo 'npm accepted the publish, but the version is still unavailable after 20 minutes. Check its publishing status before retrying.' >&2
          exit 1
