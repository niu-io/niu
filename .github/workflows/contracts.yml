name: API contract consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/contracts.yml'
      - 'apps/gateway/src/**'
      - 'contracts/**'
      - 'scripts/extract-handler-openapi.py'
      - 'scripts/check-openapi-entrypoints.py'
      - 'docs/reference/generated-api-operations.md'
      - 'apps/docs/src/content/docs/reference/handler-operations.md'
  pull_request:
    paths:
      - '.github/workflows/contracts.yml'
      - 'apps/gateway/src/**'
      - 'contracts/**'
      - 'scripts/extract-handler-openapi.py'
      - 'scripts/check-openapi-entrypoints.py'
      - 'docs/reference/generated-api-operations.md'
      - 'apps/docs/src/content/docs/reference/handler-operations.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check generated handler contracts and documentation
        run: python3 scripts/extract-handler-openapi.py --check
      - name: Check root OpenAPI exposes registered generated operations
        run: python3 scripts/check-openapi-entrypoints.py
      - name: Record verification scope
        run: echo 'Static API contract consistency only. This does not verify runtime behavior, billing, external integrations or release readiness.' >> "$GITHUB_STEP_SUMMARY"
