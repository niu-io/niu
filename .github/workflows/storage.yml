name: Storage invariants
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: storage-${{ github.event.pull_request.number || github.ref }}
  # Finish the active main run; retain the latest pending commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niu_test
          POSTGRES_PASSWORD: niu_test
          POSTGRES_DB: niu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niu_test -d niu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://niu_test:niu_test@localhost:5432/niu_test
    steps:
      - uses: actions/checkout@v4
      - name: Verify metadata importer
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Configure isolated detector credential
        run: python3 scripts/ci-fixture-env.py
      - name: Install Rust
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Verify storage against PostgreSQL
        run: cargo +1.98.0 test --locked -p niu-storage --test postgres -- --ignored
      - name: Verify gateway against PostgreSQL
        run: cargo +1.98.0 test --locked -p niu-gateway -- --ignored
