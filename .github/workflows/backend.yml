name: Backend static checks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/backend.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/gateway/**'
      - 'crates/**'
      - 'tests/extensions/**'
      - 'vendor/**'
      - 'contracts/**'
      - 'scripts/gateway-benchmark.py'
      - 'scripts/benchmark-guardrails.py'
      - 'scripts/tests/test_gateway_benchmark.py'
      - 'scripts/tests/test_benchmark_guardrails.py'
  pull_request:
    paths:
      - '.github/workflows/backend.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'apps/gateway/**'
      - 'crates/**'
      - 'tests/extensions/**'
      - 'vendor/**'
      - 'contracts/**'
      - 'scripts/gateway-benchmark.py'
      - 'scripts/benchmark-guardrails.py'
      - 'scripts/tests/test_gateway_benchmark.py'
      - 'scripts/tests/test_benchmark_guardrails.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Check workspace formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Verify selective upstream imports and checksums
        run: python3 scripts/verify-imports.py
      - name: Check generated handler OpenAPI and documentation
        run: |
          python3 scripts/extract-handler-openapi.py --check
          python3 scripts/check-openapi-entrypoints.py
      - name: Compile and lint all workspace targets
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Compile workspace test targets without executing fixtures
        run: cargo +1.98.0 test --locked --workspace --no-run
      - name: Record backend verification scope
        if: always()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          Static checks only: formatting, import integrity, generated contracts,
          compilation and Clippy. Fixture commands run separately as non-gating
          diagnostics; their outcomes have zero evidentiary value. Functional,
          stability, performance and release claims require actual current-input
          end-to-end runs and independent final-artifact verification.
          EOF
