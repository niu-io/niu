name: Public release qualification

on:
  push:
    tags:
      - "*"

permissions:
  contents: read

concurrency:
  group: qualification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: niu_test
          POSTGRES_PASSWORD: niu_test
          POSTGRES_DB: niu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U niu_test -d niu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Configure isolated detector credential
        run: python3 scripts/ci-fixture-env.py
      - name: Install Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo +1.98.0 fmt --all -- --check
      - name: Verify selective upstream imports and checksums
        run: python3 scripts/verify-imports.py
      - name: Check generated handler OpenAPI and documentation
        run: |
          python3 scripts/extract-handler-openapi.py --check
          python3 scripts/check-openapi-entrypoints.py
      - name: Install pinned Cargo license auditor
        run: cargo +1.98.0 install cargo-deny --version 0.20.2 --locked
      - name: Check Rust dependency licenses
        run: cargo deny check licenses
      - name: Lint workspace
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Test workspace
        run: cargo +1.98.0 test --locked --workspace
      - name: Test PostgreSQL storage integration
        env:
          DATABASE_URL: postgres://niu_test:niu_test@127.0.0.1:5432/niu_test
        run: cargo +1.98.0 test --locked -p niu-storage --tests -- --ignored
      - name: Test PostgreSQL gateway integration
        env:
          DATABASE_URL: postgres://niu_test:niu_test@127.0.0.1:5432/niu_test
        run: cargo +1.98.0 test --locked -p niu-gateway -- --ignored
      - name: Run paired benchmark fixture
        run: cargo +1.98.0 run --locked -p niu-benchmark -- compare contracts/fixtures/paired-experiment.v1.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Check public source boundary and build inputs
        run: |
          python3 scripts/check-public-boundary.py --root . --tracked-tree --check-build-inputs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - name: Install JavaScript workspace
        run: pnpm install --frozen-lockfile
      - name: Check JavaScript dependency licenses
        env:
          NIU_JS_LICENSE_REPORT: ${{ runner.temp }}/niu-js-license-report.json
        run: node scripts/verify-js-licenses.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: javascript-license-report
          path: ${{ runner.temp }}/niu-js-license-report.json
          if-no-files-found: ignore
      - name: Check dashboard types
        run: pnpm --filter @niu-io/dashboard check
      - name: Build dashboard
        run: pnpm --filter @niu-io/dashboard build
      - name: Check documentation
        run: pnpm --filter @niu-io/docs check
      - name: Build documentation
        run: pnpm --filter @niu-io/docs build
      - name: Check public catalog
        run: pnpm check:catalog
      - name: Build public catalog
        run: pnpm build:catalog
      - name: Scan generated public artifacts
        run: python3 scripts/check-public-boundary.py --root . apps/dashboard/dist apps/docs/dist apps/catalog/dist
      - name: Check JavaScript SDK types
        run: pnpm --dir sdks/javascript run check
      - name: Build JavaScript SDK
        run: pnpm --dir sdks/javascript run build
      - name: Check Agent Connect SDK types
        run: pnpm --dir sdks/agent-connect run check
      - name: Build Agent Connect SDK
        run: pnpm --dir sdks/agent-connect run build

      # Compile, type-check and inspect build artifacts before fixture commands.
      # Fixture outcomes do not qualify integrated behavior or release readiness.
      - name: Test Python scripts
        run: python3 -m unittest discover -s scripts/tests
      - name: Test dashboard
        run: pnpm --filter @niu-io/dashboard test
      - name: Test JavaScript SDK
        run: pnpm --dir sdks/javascript run test
      - name: Test Agent Connect SDK
        run: pnpm --dir sdks/agent-connect run test

  package:
    runs-on: ubuntu-latest
    needs:
      - rust
      - web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Resolve the previous release tag
        id: previous
        run: |
          previous=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            echo "sha=$(git rev-list -n 1 "$previous")" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: docker/setup-buildx-action@v3
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: ${{ steps.previous.outputs.sha != '' }}
        with:
          ref: ${{ steps.previous.outputs.sha }}
          path: previous-source
      - name: Check released migration immutability
        if: ${{ steps.previous.outputs.sha != '' }}
        run: python3 scripts/check-migration-history.py previous-source/crates/storage/migrations crates/storage/migrations
      - name: Build previous package for upgrade qualification
        if: ${{ steps.previous.outputs.sha != '' }}
        run: docker buildx build --load --tag niu-io/niu:previous ./previous-source
      - name: Build single-container product
        run: docker buildx build --load --tag niu-io/niu:ci .
      - name: Inspect runtime package contents
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' niu-io/niu:ci)" = "10001:10001"
          docker run --rm --entrypoint /bin/sh niu-io/niu:ci -c 'set -- /app/dashboard/assets/*.js; test -x /usr/local/bin/niu-gateway && test -s /app/dashboard/index.html && test -s "$1" && test -s /app/docs/index.html && test -s /app/docs/pagefind/pagefind.js && test -s /app/catalog/models/index.html && set -- /app/catalog/_catalog/*.css && test -s "$1" && test -s /app/catalog/catalog-assets/brand/niu-mark.png && test -s /app/catalog/catalog-assets/models.js && test ! -e /app/Cargo.toml && test ! -e /app/node_modules'
      - name: Scan final runtime assets
        run: |
          container=$(docker create niu-io/niu:ci)
          destination=$(mktemp -d)
          trap 'docker rm "$container" >/dev/null' EXIT
          docker cp "$container:/app" "$destination/app"
          python3 scripts/check-public-boundary.py --root . "$destination/app"
      - name: Smoke test the packaged application with PostgreSQL
        env:
          NIU_IMAGE: niu-io/niu:ci
          NIU_PACKAGE_BRANDING: "1"
        run: python3 scripts/package-smoke.py
      - name: Smoke test Compose persistence and PostgreSQL backup/restore
        env:
          NIU_IMAGE: niu-io/niu:ci
          NIU_PACKAGE_BRANDING: "1"
        run: python3 scripts/package-smoke.py --compose
      - id: package-images
        if: ${{ steps.previous.outputs.sha != '' }}
        run: |
          echo "previous=$(docker image inspect --format '{{.Id}}' niu-io/niu:previous)" >> "$GITHUB_OUTPUT"
          echo "current=$(docker image inspect --format '{{.Id}}' niu-io/niu:ci)" >> "$GITHUB_OUTPUT"
      - name: Report unchanged runtime package
        if: ${{ steps.package-images.outputs.previous != '' && steps.package-images.outputs.previous == steps.package-images.outputs.current }}
        run: echo 'Runtime image is unchanged; no distinct package upgrade exists for this commit. Package smoke checks still ran. Upgrade qualification is not claimed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Smoke test package upgrade and migration recovery
        if: ${{ steps.package-images.outputs.previous != '' && steps.package-images.outputs.previous != steps.package-images.outputs.current }}
        env:
          NIU_PREVIOUS_IMAGE: ${{ steps.package-images.outputs.previous }}
          NIU_IMAGE: ${{ steps.package-images.outputs.current }}
        run: python3 scripts/package-upgrade-smoke.py
