name: Bug Report
description: Report a bug in the Niu gateway, dashboard, catalog, SDKs, or installation tooling
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug in Niu. For security vulnerabilities, please do **not** open a public issue; report them privately via [GitHub Security Advisories](https://github.com/niu-io/niu/security/advisories/new).

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the Niu monorepo is affected?
      options:
        - Gateway (apps/gateway - /v1, /api/v1, /catalog/v1)
        - Dashboard (apps/dashboard)
        - Public Model Catalog (apps/catalog)
        - Documentation (apps/docs)
        - Storage & Migrations (crates/storage)
        - Plugin Host & SDK (crates/plugin-api, crates/plugin-sdk, plugins/*)
        - Client SDKs (sdks/javascript, sdks/agent-connect)
        - Installation / Docker / Release Tooling (scripts/install.sh, Dockerfile, compose.yaml)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Niu Version
      description: Output of `niu-gateway --version`, release tag (e.g. `v0.2.0`), or commit SHA
      placeholder: "niu-gateway 0.2.0 (v0.2.0)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug and how it differs from expected behavior.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Minimal steps, HTTP requests, or configuration needed to reproduce the issue (redact any API keys or secrets).
      placeholder: |
        1. Configure route ...
        2. Send request to `/v1/chat/completions` ...
        3. Observe response ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs or Error Output
      description: Paste any relevant gateway logs, stack traces, or browser console errors (ensure secrets and tokens are redacted).
      render: shell
