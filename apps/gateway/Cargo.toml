[package]
name = "niu-gateway"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "niu-gateway"
path = "src/main.rs"

[dependencies]
axum.workspace = true
futures-util.workspace = true
niu-execution = { path = "../../crates/execution" }
niu-storage = { path = "../../crates/storage" }
litellm-core = { path = "../../vendor/litellm-rust/crates/core" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
