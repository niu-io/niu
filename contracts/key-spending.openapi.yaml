openapi: 3.1.0
info:
  title: Niu API-key customer spending limits
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/spending-limit:
    parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Key'
    get:
      security: [{ bearerAuth: [] }]
      operationId: listKeySpendingLimits
      description: Scoped readers may inspect customer commitments. Rotated keys share the original spending identity. Personal upstream routes do not consume customer funds. No Supplier costs or company balance are exposed.
      responses:
        '200':
          description: Account currencies and lifetime key commitments; null limit means unlimited and null revision means never configured.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [currency, limit_nanos, revision, committed_nanos, remaining_nanos]
                      properties:
                        currency: { type: string, pattern: '^[A-Z]{3}$' }
                        limit_nanos: { type: [string, 'null'], pattern: '^[0-9]+$' }
                        revision: { type: [string, 'null'], pattern: '^[0-9]+$' }
                        committed_nanos: { type: string, pattern: '^[0-9]+$' }
                        remaining_nanos:
                          type: [string, 'null']
                          pattern: '^[0-9]+$'
                          description: Maximum of cap minus committed customer amount and zero; null for unlimited. This is key allowance only, not company balance or guaranteed admission.
        '401': { description: Authentication required }
        '403': { description: Workspace access denied }
        '404': { description: Key does not exist in the authorized workspace }
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/spending-limit/{currency}:
    parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Currency'
    put:
      security: [{ bearerAuth: [] }]
      operationId: setKeySpendingLimit
      description: Workspace/company owner or installation administrator. Cap includes settled customer charges minus refunds plus unreleased reservations, across secret rotations. Lowering below committed liability is rejected. Account and workspace limits still apply. Writes do not add funds. Null explicitly restores unlimited; omission is rejected.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [limit_nanos, expected_revision]
              properties:
                limit_nanos: { type: [string, 'null'], pattern: '^[0-9]+$', description: Nonnegative signed-64-bit nanounits or explicit null. }
                expected_revision: { type: string, pattern: '^[0-9]+$', description: Zero for initial configuration; maximum 9223372036854775806. }
      responses:
        '200':
          description: New immutable policy revision recorded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revision: { type: string, pattern: '^[1-9][0-9]*$' }
        '400': { description: Invalid amount or currency }
        '401': { description: Authentication required }
        '402': { description: Proposed limit is below committed key liability }
        '403': { description: Owner permission required }
        '404': { description: Key does not exist in the authorized workspace }
        '409': { description: Stale revision, missing account, or unresolved attribution }
        '422': { description: Missing or invalid body fields }
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/spending-limit/{currency}/history:
    parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Workspace'
      - $ref: '#/components/parameters/Key'
      - $ref: '#/components/parameters/Currency'
    get:
      security: [{ bearerAuth: [] }]
      operationId: listKeySpendingLimitHistory
      parameters:
        - { name: before_revision, in: query, schema: { type: integer, minimum: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
      description: Descending immutable revision history shared across rotations. Use the last returned revision as before_revision for the next page. Returns currency, nullable limit_nanos, revision, recorded_at, actor_kind and actor_name; never an internal actor identifier.
      responses:
        '200': { description: Data array of policy revisions }
        '400': { description: Invalid currency or pagination }
        '401': { description: Authentication required }
        '403': { description: Workspace access denied }
        '404': { description: Key does not exist in the authorized workspace }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Organization: { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
    Workspace: { name: project, in: path, required: true, schema: { type: string, format: uuid } }
    Key: { name: key, in: path, required: true, schema: { type: string, format: uuid } }
    Currency: { name: currency, in: path, required: true, schema: { type: string, pattern: '^[A-Z]{3}$' } }
