openapi: 3.1.0
info:
  title: Niu customer usage billing
  version: 0.1.0
security:
  - adminBearerAuth: []
paths:
  /admin/v1/organizations/{organization}/billing/media-rates/{revision}/retire:
    parameters:
      - $ref: '#/components/parameters/Organization'
      - name: revision
        in: path
        required: true
        schema: { type: string, minLength: 1, maxLength: 256 }
    post:
      operationId: retireCustomerMediaRate
      summary: End a published customer media rate's eligibility
      description: Platform-administrator write permission required. Installation credentials and explicitly granted member administrators are supported. Appends an immutable cutoff without modifying the original card or historical job snapshots. Cutoff is inclusive for retirement and must be within the original effective interval, including its start/end boundaries. Exact replay is idempotent; changed cutoff or unknown customer/revision conflicts. Publish the replacement with an effective start matching the cutoff. No rate or procurement fallback occurs if no eligible replacement exists; remaining overlaps are rejected as ambiguous.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [effective_until]
              properties:
                effective_until: { type: integer, description: Unix seconds }
      responses:
        '200':
          description: Retirement saved or identical replay accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [revision, effective_until]
                    properties:
                      revision: { type: string }
                      effective_until: { type: string, pattern: '^-?[0-9]+$' }
        '400': { description: Invalid revision or cutoff outside original interval }
        '401': { description: Administrator authentication required }
        '403': { description: Platform-administrator write permission required }
        '409': { description: Missing scoped revision or conflicting previous cutoff }
        '413': { description: Body exceeds 1 KiB }
        '422': { description: Malformed typed JSON body }
        '503': { description: Durable storage unavailable }
  /admin/v1/organizations/{organization}/billing/media-rate-models:
    parameters:
      - $ref: '#/components/parameters/Organization'
    get:
      operationId: listCustomerMediaRateModels
      summary: Read named qualified commercial video configuration choices
      description: Platform-administrator read permission required. Installation credentials and explicitly granted member administrators are supported. Lists currently active, qualified, nonpersonal routes with exact credential/model/offer/schema bindings. No credentials, endpoints, purchase prices or customer charges. Cursor advances over raw model aliases even when invalid schemas are omitted; empty pages can therefore have a continuation. Choices do not authorize dispatch or guarantee later availability.
      parameters:
        - name: after
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Bounded current choices
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more, next_after]
                properties:
                  has_more: { type: boolean }
                  next_after: { type: [string, 'null'] }
                  data:
                    type: array
                    items:
                      type: object
                      required: [model_alias, api_key_name, vendor_id, offer_revision, vendor_revision, model_revision, schema_revision, channel, resolutions, reference_video]
                      properties:
                        model_alias: { type: string }
                        api_key_name: { type: string }
                        vendor_id: { type: string, format: uuid, description: Internal configuration binding; never a display label. }
                        offer_revision: { type: string, format: uuid }
                        vendor_revision: { type: string, pattern: '^[0-9]+$' }
                        model_revision: { type: string, pattern: '^[0-9]+$' }
                        schema_revision: { type: string }
                        channel: { type: string }
                        resolutions: { type: array, items: { type: string } }
                        reference_video: { type: boolean }
        '400': { description: Invalid cursor or page size }
        '401': { description: Administrator authentication required }
        '403': { description: Platform-administrator read permission required }
        '503': { description: Durable storage unavailable }
  /admin/v1/organizations/{organization}/billing/media-rates/replace:
    parameters:
      - $ref: '#/components/parameters/Organization'
    post:
      operationId: replaceCustomerMediaRate
      summary: Atomically replace a customer media selling schedule
      description: Platform-administrator write permission required. Installation credentials and explicitly granted member administrators are supported. Publishes the immutable replacement and retires the previous scoped schedule at the new effective start in one transaction. Dimensions and meter must match; competing effective schedules conflict. Identical replay is accepted while route bindings remain current. Any publication or retirement failure rolls back both changes. Historical cards and pinned jobs are unchanged. No procurement fallback or automatic submission retry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [previous_revision, rate]
              properties:
                previous_revision: { type: string, minLength: 1, maxLength: 256 }
                rate: { $ref: '#/components/schemas/CustomerMediaRateCard' }
      responses:
        '200':
          description: Replacement committed or identical replay accepted
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revision, effective_from]
                    properties:
                      revision: { type: string }
                      effective_from: { type: string, pattern: '^-?[0-9]+$' }
        '400': { description: "Invalid card, changed dimensions or cutoff outside original interval" }
        '401': { description: Administrator authentication required }
        '403': { description: Platform-administrator write permission required }
        '409': { description: "Missing scoped revision, competing schedule, stale route or conflicting receipt" }
        '413': { description: Body exceeds 128 KiB }
        '422': { description: Malformed typed JSON body }
        '503': { description: Durable storage unavailable }
  /admin/v1/organizations/{organization}/billing/media-rates:
    parameters:
      - $ref: '#/components/parameters/Organization'
    get:
      operationId: listCustomerMediaRates
      summary: Read bounded immutable customer selling history
      description: Platform-administrator read permission required. Installation credentials and explicitly granted member administrators are supported. Ordinary company members and inference keys cannot read platform pricing configuration. Returns original cards, immutable retirement and creation time; never reads Supplier purchase terms. Card vendor/model revisions, tariff amount/time values and discount times are exact decimal strings, while quantities retain numerator/denominator strings. Ordering and cursors use the immutable card revision.
      parameters:
        - name: after
          in: query
          schema: { type: string, minLength: 1, maxLength: 256 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Scoped history page, including an empty page
          content:
            application/json:
              schema:
                type: object
                required: [data, has_more, next_after]
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required: [card, retirement_effective_until, created_at]
                      properties:
                        card: { $ref: '#/components/schemas/CustomerMediaRateRecordCard' }
                        retirement_effective_until: { type: [string, 'null'], pattern: '^-?[0-9]+$' }
                        created_at: { type: [string, 'null'], format: date-time }
                  has_more: { type: boolean }
                  next_after: { type: [string, 'null'] }
        '400': { description: Invalid page size or cursor }
        '401': { description: Administrator authentication required }
        '403': { description: Platform-administrator read permission required }
        '503': { description: Durable storage unavailable }
    post:
      operationId: publishCustomerMediaRate
      summary: Publish an immutable customer video selling schedule
      description: Platform administrator with write access required. Ordinary company members and inference keys cannot publish prices or liability limits. Pins exact credential/model/schema revisions and a configured qualification reference; registration does not qualify commercial supply or enable video dispatch. Rejects personal credentials and stale routes. Replaying identical current configuration is idempotent; changed content under the same revision conflicts. Procurement terms never belong in this body. Maximum JSON body is 128 KiB.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerMediaRateCard' }
      responses:
        '200':
          description: Customer selling revision published or identical replay accepted
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: object
                    additionalProperties: false
                    required: [revision]
                    properties:
                      revision: { type: string }
        '400': { description: "Invalid tariff, dimensions, discount or liability configuration" }
        '401': { description: Administrator authentication required }
        '403': { description: Platform-administrator write permission required }
        '409': { description: "Changed revision, stale route or personal credential" }
        '413': { description: Body exceeds 128 KiB }
        '422': { description: Malformed typed JSON body }
        '503': { description: Durable storage unavailable }
  /admin/v1/organizations/{organization}/billing/payment-methods:
    get:
      $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1payment-methods/get'
  /admin/v1/organizations/{organization}/billing/topups:
    get:
      $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1topups/get'
    post:
      $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1topups/post'
  /admin/v1/organizations/{organization}/billing/topups/{order}:
    get:
      $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1topups~1{order}/get'
  /admin/v1/organizations/{organization}/billing/topups/{order}/reconcile:
    parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/TopupOrder'
    post:
      operationId: reconcileCustomerTopup
      summary: Independently reconcile a saved payment
      description: Installation administrator with write permission only. Queries the original configured merchant under shared query spacing. Exact paid evidence funds atomically once; verified closed evidence records immutable closure without funding. Pending, failed or contradictory evidence remains unresolved. Never creates a new checkout. A successful response reports resulting durable status, which may be closed rather than paid.
      responses:
        '200': { $ref: '#/components/responses/TopupStatus' }
        '400': { description: Invalid identifier or incompatible saved merchant configuration }
        '401': { description: Authentication required }
        '403': { description: Installation administrator required }
        '404': { description: Saved order missing }
        '409': { description: Conflicting immutable identity or terminal evidence }
        '501': { description: Saved adapter does not support query recovery; EPay remains notification-driven }
        '502': { description: "Integration unavailable, pending payment, unresolved evidence or query admission busy/rate limited" }
        '503': { description: Durable storage unavailable }
  /payments/epay/notify:
    $ref: './generated/handler-operations.json#/paths/~1payments~1epay~1notify'
  /payments/zhifux/notify:
    post:
      operationId: receiveZhifuxNotification
      summary: Receive signed merchant notification
      security: []
      description: Public signed post_form callback for the configured merchant, limited to 8192 body bytes. Verifies exact saved intent and commits an immutable receipt before acknowledgement. Unsigned extra fields are ignored and never authorize funding or closure. Independent authenticated query gates funding. Post-body receipt processing has a two-second deadline; errors and timeout must be retried by the sender. Browser return URLs are not accepted as evidence.
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [merchantNum, orderNo, amount, state, sign]
              properties:
                merchantNum: { type: string }
                orderNo: { type: string, pattern: '^[0-9a-f]{32}$' }
                amount: { type: string, description: Exact requested decimal CNY amount from the saved intent. }
                state: { type: string, enum: ['1'] }
                sign: { type: string, pattern: '^[0-9a-f]{32}$' }
      responses:
        '200':
          description: Durable verified receipt accepted; does not mean paid or funded
          content:
            text/plain:
              schema: { type: string, const: success }
        '400': { description: Invalid signed evidence or malformed form }
        '404': { description: Saved merchant order missing }
        '413': { description: Body exceeds 8192 bytes }
        '415': { description: Form content type required }
        '422': { description: Required form field missing }
        '502': { description: Integration unavailable or receipt processing timed out; retry notification }
        '503': { description: Durable receipt storage unavailable; retry notification }
  /admin/v1/organizations/{organization}/billing/accounts/{currency}/warning-threshold:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1accounts~1{currency}~1warning-threshold'
  /admin/v1/organizations/{organization}/billing/transactions:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1transactions'
  /admin/v1/organizations/{organization}/billing/entries/{entry}/reversal:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1entries~1{entry}~1reversal'
  /admin/v1/organizations/{organization}/billing/accounts/{currency}/policy:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1accounts~1{currency}~1policy'
  /admin/v1/organizations/{organization}/billing/charge-reconciliation:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1charge-reconciliation'
  /admin/v1/organizations/{organization}/billing/balance:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1billing~1balance'
  /admin/v1/organizations/{organization}/billing/funding/settled:
    parameters:
      - $ref: '#/components/parameters/Organization'
    post:
      operationId: recordSettledCustomerFunding
      summary: Record an externally verified settled customer payment
      description: Installation write access only. Trusted administration must verify external payment settlement before calling. This is not a customer self-credit endpoint or a payment-channel callback integration. The channel/payment reference credits funds once; changed organization, currency or amount is a conflict. Pending payments must not be submitted. No commercial payment channel is implied by this administrative record API.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currency, amount_nanos, channel, payment_reference]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                amount_nanos: { type: string, pattern: '^[0-9]+$', description: Positive signed-64-bit nanounit amount }
                channel: { type: string, minLength: 1, maxLength: 100 }
                payment_reference: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Recorded or identical receipt replay
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      recorded: { type: boolean, const: true }
        '400': { description: Invalid funding details }
        '401': { description: Authentication required }
        '403': { description: Installation write access required }
        '409': { description: Unknown organization or conflicting payment reference }
  /admin/v1/organizations/{organization}/projects/{project}/billing:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1billing'
  /admin/v1/organizations/{organization}/projects/{project}/billing/tariffs:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1billing~1tariffs'
  /admin/v1/organizations/{organization}/projects/{project}/billing/invoices:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1billing~1invoices'
  /admin/v1/organizations/{organization}/projects/{project}/billing/invoices/{invoice}:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1billing~1invoices~1{invoice}'
  /admin/v1/organizations/{organization}/projects/{project}/billing/invoices/{invoice}/payment:
    parameters:
      - $ref: '#/components/parameters/Organization'
      - $ref: '#/components/parameters/Project'
      - $ref: '#/components/parameters/Invoice'
    post:
      security: [{ adminBearerAuth: [] }]
      operationId: recordCustomerExternalPayment
      summary: Record one confirmed full external invoice payment
      description: Installation only. Records a full external payment only for a positive invoice with no balance-bound charges. Mixed invoices, balance-backed invoices and zero-value invoices conflict. Does not top up an account or accept partial payments. Existing exact retries remain idempotent. Does not charge any payment method. References cannot be reused on another invoice. Cache-Control is no-store.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [payment_reference]
              properties:
                payment_reference: { type: string, minLength: 1, maxLength: 200, description: Trimmed nonempty external payment reference; maximum 200 UTF-8 bytes and no control characters. }
      responses:
        '200': { $ref: '#/components/responses/InvoiceIdentity' }
        '400': { description: Invalid reference }
        '403': { description: Installation authority required }
        '409': { description: "Invoice missing, balance-bound or zero-value invoice, already recorded with another reference, or reference already used" }
components:
  responses:
    EPayAcknowledgment:
      description: Verified payment committed or replayed; exactly one saved-order credit
      headers:
        Cache-Control:
          schema: {type: string, const: no-store}
      content:
        text/plain:
          schema: {type: string, const: success}
    TopupStatus:
      description: Saved top-up status; checkout and pending status confer no spending capacity
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: { $ref: '#/components/schemas/Topup' }
    InvoiceIdentity:
      description: Invoice identity, including an exact idempotent replay
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                type: object
                required: [id]
                properties:
                  id: { type: string, format: uuid }
  securitySchemes:
    adminBearerAuth: { type: http, scheme: bearer }
  parameters:
    TopupOrder: { name: order, in: path, required: true, schema: { type: string, format: uuid } }
    Organization: { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
    Project: { name: project, in: path, required: true, schema: { type: string, format: uuid } }
    Invoice: { name: invoice, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    InvoiceQuantity:
      type: object
      required: [numerator, denominator]
      properties:
        numerator: { type: string, pattern: '^[0-9]+$' }
        denominator: { type: string, pattern: '^[1-9][0-9]*$' }
    TopupHistoryEntry:
      type: object
      additionalProperties: false
      required: [id, currency, amount_nanos, payment_method, status, checkout_url, created_at]
      properties:
        id: { type: string, format: uuid, description: Internal routing/cursor reference; never display as a product label. }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        amount_nanos: { type: string, pattern: '^[0-9]+$' }
        payment_method: { type: string }
        status: { type: string, enum: [reconciliation_required, pending, paid, closed] }
        checkout_url: { type: [string, 'null'], format: uri }
        created_at: { type: string, format: date-time }
    Topup:
      type: object
      additionalProperties: false
      required: [id, currency, amount_nanos, payment_method, status, checkout_url]
      properties:
        id: { type: string, format: uuid, description: Internal API routing reference; never display as a product label. }
        currency: { type: string, pattern: '^[A-Z]{3}$', description: Immutable saved account currency; no implicit conversion. }
        amount_nanos: { type: string, pattern: '^[0-9]+$' }
        payment_method: { type: string }
        status: { type: string, enum: [reconciliation_required, pending, paid, closed] }
        checkout_url: { type: [string, 'null'], format: uri, description: Validated HTTPS checkout for pending orders only; null for paid and closed orders. }
    IntegerString: { type: string, pattern: '^[0-9]+$' }
    Tariff:
      type: object
      required: [model_alias, revision, currency, prompt_rate, completion_rate]
      properties:
        model_alias: { type: string }
        revision: { type: string, format: uuid }
        currency: { type: string }
        prompt_rate: { $ref: '#/components/schemas/IntegerString' }
        completion_rate: { $ref: '#/components/schemas/IntegerString' }
        cached_prompt_rate: { type: [string, 'null'], pattern: '^[0-9]+$' }
    Invoice:
      type: object
      required: [id, from_ms, to_ms, currency, amount_nanos, created_at, status, payment_reference]
      properties:
        id: { type: string, format: uuid }
        from_ms: { type: integer, format: int64 }
        to_ms: { type: integer, format: int64 }
        currency: { type: string }
        amount_nanos: { $ref: '#/components/schemas/IntegerString' }
        created_at: { type: string, format: date-time }
        status:
          type: string
          enum: [issued, paid]
          description: Paid when an invoice receipt exists or every included charge is settled by a matching balance debit or has zero value. Credit-backed account debt remains separate.
        payment_reference: { type: [string, 'null'] }
    ExactMediaQuantity:
      type: object
      additionalProperties: false
      required: [numerator, denominator]
      description: Reduced nonnegative rational quantity; canonical decimal strings bounded to u128. Denominator must be positive. Maximum liability quantity must be positive.
      properties:
        numerator: { type: string, maxLength: 39, pattern: '^(0|[1-9][0-9]*)$' }
        denominator: { type: string, maxLength: 39, pattern: '^[1-9][0-9]*$' }
    MediaBillingDimensions:
      type: object
      additionalProperties: false
      required: [model, channel, resolution, reference_video]
      properties:
        model: { type: string, minLength: 1, maxLength: 256 }
        channel: { type: string, minLength: 1, maxLength: 256 }
        resolution: { type: string, minLength: 1, maxLength: 256 }
        reference_video: { type: boolean }
    MediaSellingTariff:
      type: object
      additionalProperties: false
      required: [revision, dimensions, meter, currency, decimal_places, amount_units, per_quantity, minimum_quantity, rounding, effective_from]
      properties:
        revision: { type: string, minLength: 1, maxLength: 256 }
        dimensions: { $ref: '#/components/schemas/MediaBillingDimensions' }
        meter: { type: string, minLength: 1, maxLength: 256 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        decimal_places: { type: integer, minimum: 0, maximum: 9 }
        amount_units: { type: integer, minimum: 0, description: Exact u64 smallest accounting units at the declared decimal precision. JavaScript SDK requires a safe integer. }
        per_quantity: { $ref: '#/components/schemas/ExactMediaQuantity' }
        minimum_quantity: { $ref: '#/components/schemas/ExactMediaQuantity' }
        rounding: { type: string, enum: [Down, Up, HalfEven] }
        effective_from: { type: integer, format: int64, description: "Unix seconds, inclusive." }
        effective_until: { type: [integer, 'null'], format: int64, description: "Unix seconds, exclusive; must exceed effective_from." }
    MediaSellingDiscount:
      type: object
      additionalProperties: false
      required: [revision, effective_from, priority, stacking, multiplier]
      properties:
        revision: { type: string, minLength: 1, maxLength: 256 }
        dimensions: { anyOf: [{ $ref: '#/components/schemas/MediaBillingDimensions' }, { type: 'null' }] }
        offer: { type: [string, 'null'] }
        customer: { type: [string, 'null'] }
        effective_from: { type: integer, format: int64 }
        effective_until: { type: [integer, 'null'], format: int64 }
        priority: { type: integer, format: int32 }
        stacking: { type: string, enum: [Exclusive, Multiply] }
        multiplier: { $ref: '#/components/schemas/ExactMediaQuantity' }
    CustomerMediaRateRecordCard:
      type: object
      required: [revision, vendor_id, vendor_revision, model_revision, schema_revision, offer_revision, tariff, discounts, maximum_quantity, liability_qualification_revision]
      properties:
        revision: { type: string }
        vendor_id: { type: string, format: uuid }
        vendor_revision: { type: string, pattern: '^[0-9]+$' }
        model_revision: { type: string, pattern: '^[0-9]+$' }
        schema_revision: { type: string }
        offer_revision: { type: string }
        maximum_quantity: { $ref: '#/components/schemas/ExactMediaQuantity' }
        liability_qualification_revision: { type: string }
        tariff: { $ref: '#/components/schemas/MediaSellingTariffRecord' }
        discounts: { type: array, items: { $ref: '#/components/schemas/MediaSellingDiscountRecord' } }
    CustomerMediaRateCard:
      type: object
      additionalProperties: false
      required: [revision, vendor_id, vendor_revision, model_revision, schema_revision, offer_revision, tariff, discounts, maximum_quantity, liability_qualification_revision]
      properties:
        revision: { type: string, minLength: 1, maxLength: 256 }
        vendor_id: { type: string, format: uuid, description: Internal route reference; never a display label. }
        vendor_revision: { type: integer, minimum: 1, format: int64 }
        model_revision: { type: integer, minimum: 1, format: int64 }
        schema_revision: { type: string, minLength: 1, maxLength: 256 }
        offer_revision: { type: string, minLength: 1, maxLength: 256 }
        tariff: { $ref: '#/components/schemas/MediaSellingTariff' }
        discounts: { type: array, maxItems: 64, items: { $ref: '#/components/schemas/MediaSellingDiscount' } }
        maximum_quantity: { $ref: '#/components/schemas/ExactMediaQuantity' }
        liability_qualification_revision: { type: string, minLength: 1, maxLength: 256, description: Reference to independently qualified upper-bound evidence; a point estimate is insufficient. }
    MediaSellingTariffRecord:
      type: object
      additionalProperties: false
      required: [revision, dimensions, meter, currency, decimal_places, amount_units, per_quantity, minimum_quantity, rounding, effective_from]
      properties:
