openapi: 3.1.0
info:
  title: Niu Request Observability API
  version: 0.1.0
paths:
  /admin/v1/organizations/{organization}/projects/{project}/requests/{attempt}:
    get:
      $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1requests~1{attempt}/get'
  /admin/v1/organizations/{organization}/projects/{project}/requests/{attempt}/payloads:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: attempt, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getRequestPayload
      summary: Read retained request content in an authorized workspace
      description: Content is separate from accounting, expires 24 hours after the original request creation time and is retained by default unless the inference request opts out. Missing or expired content returns null. Headers and known confidential Supplier cost fields are excluded, including historical response usage metadata sanitized on read. Truncated SSE captures expose only complete sanitized events. Truncated JSON that cannot be safely parsed is withheld as an empty response string with response_omitted true, while authorized request content stays readable. Other malformed or incomplete structured responses fail closed with 503. Known credential fields in historical request objects are removed on read. Arbitrary secrets embedded in prompts are not automatically redacted.
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: Workspace read permission required. Response uses Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    oneOf:
                      - { type: 'null' }
                      - { $ref: '#/components/schemas/RequestPayload' }
        '401': { description: Authentication required. }
        '403': { description: The authenticated role lacks the required permission. }
        '404': { description: Workspace is outside the authenticated scope. }
        '503': { description: "Retained structured response cannot be safely serialized, or content storage is unavailable. No unsanitized payload is returned." }
    delete:
      operationId: deleteRequestPayload
      summary: Delete retained content without deleting accounting records
      description: Requires workspace write permission. A durable content-free deletion marker prevents concurrent or late capture from recreating deleted payloads, including deletion before capture. Accounting records remain unchanged. Cross-workspace or absent attempts do not create markers.
      security: [{ adminBearerAuth: [] }]
      responses:
        '204': { description: Scoped deletion completed; workspace write permission required. }
        '401': { description: Authentication required. }
        '403': { description: The authenticated role lacks the required permission. }
        '404': { description: Workspace is outside the authenticated scope. }
components:
  securitySchemes:
    adminBearerAuth: { type: http, scheme: bearer }
  parameters:
    LogPayloads:
      name: x-niu-log-payloads
      in: header
      required: false
      description: Request and sanitized customer response content is retained until 24 hours after the original request creation time by default. Send false (case-insensitive) to disable capture for this request; true or an omitted header retains content. Invalid values or repeated headers are rejected before inference. Requests exceeding the 1 MB capture limit are rejected; response capture is truncated at 1 MB. Does not backfill earlier requests.
      schema: { type: string, enum: ['true', 'false'], default: 'true' }
  schemas:
    RequestFailure:
      type: object
      additionalProperties: false
      required: [kind, upstream_http_status]
      properties:
        kind:
          type: string
          enum: [upstream_http_error, upstream_region_unavailable, upstream_timeout, upstream_connection_error, upstream_transport_error, upstream_invalid_response]
        upstream_http_status:
          type: [integer, 'null']
          minimum: 100
          maximum: 599
          description: Recorded upstream non-success status. Null for transport or invalid-response classifications. This is independent of the HTTP status delivered by Niu.
    CustomerChargeBreakdown:
      type: object
      description: Full-range customer ledger totals grouped separately by currency; missing amounts stay null. Coverage counts partition each row's requests. Supplier expenses are excluded.
      required: [currency, amount_nanos, request_count, charged_requests, unresolved_requests, unpriced_requests, not_charged_requests]
      properties:
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        amount_nanos: { type: [string, 'null'], pattern: '^[0-9]+$' }
        request_count: { type: integer, minimum: 0 }
        charged_requests: { type: integer, minimum: 0 }
        unresolved_requests: { type: integer, minimum: 0 }
        unpriced_requests: { type: integer, minimum: 0 }
        not_charged_requests: { type: integer, minimum: 0 }
    ModelCharges:
      allOf:
        - { $ref: '#/components/schemas/CustomerChargeBreakdown' }
        - type: object
          required: [model_alias]
          properties:
            model_alias: { type: string }
    KeyCharges:
      allOf:
        - { $ref: '#/components/schemas/CustomerChargeBreakdown' }
        - type: object
          required: [api_key_id, key_name]
          properties:
            api_key_id: { type: [string, 'null'], format: uuid }
            key_name: { type: [string, 'null'] }
    RequestPayload:
      type: object
      additionalProperties: false
      required: [request, response, content_type, complete, truncated, expires_at]
      properties:
        request: { description: Captured JSON request with known credential fields removed. }
        response: { type: string, description: Sanitized retained output; empty when response_omitted is true. }
        response_omitted: { type: boolean, description: True when truncated JSON cannot be safely parsed and its response body is withheld. Request content remains available. }
        content_type: { type: string }
        complete: { type: boolean }
        truncated: { type: boolean }
        expires_at: { type: string, description: PostgreSQL timestamp identifying content expiry. }
    RequestTiming:
      type: object
      additionalProperties: false
      required: [dispatch_ms, headers_ms, first_output_ms, total_ms, complete, http_status]
      description: Monotonic millisecond offsets from gateway request handling. Missing observations stay null; values do not include client network delivery after body consumption. First output means a meaningful streamed Chat event, not a role, keepalive or usage event.
      properties:
        dispatch_ms: { type: [integer, 'null'], minimum: 0 }
        headers_ms: { type: [integer, 'null'], minimum: 0 }
        first_output_ms: { type: [integer, 'null'], minimum: 0 }
        total_ms: { type: integer, minimum: 0 }
        complete: { type: boolean, description: The response body reached EOF without a stream error; not a claim of successful inference. }
        http_status: { type: [integer, 'null'], minimum: 100, maximum: 599 }
    ModelUsage:
      type: object
      additionalProperties: false
      required: [model_alias, request_count, usage_count, prompt_tokens, completion_tokens, unknown_usage_count]
      properties:
        model_alias: { type: string }
        request_count: { type: integer, minimum: 0 }
        usage_count: { type: integer, minimum: 0 }
        prompt_tokens: { type: string, pattern: '^[0-9]+$' }
        completion_tokens: { type: string, pattern: '^[0-9]+$' }
        unknown_usage_count: { type: integer, minimum: 0 }
    KeyUsage:
      type: object
      additionalProperties: false
      required: [api_key_id, key_name, request_count, usage_count, prompt_tokens, completion_tokens, unknown_usage_count]
      properties:
        api_key_id: { type: [string, 'null'], format: uuid }
        key_name: { type: [string, 'null'] }
        request_count: { type: integer, minimum: 0 }
        usage_count: { type: integer, minimum: 0 }
        prompt_tokens: { type: string, pattern: '^[0-9]+$' }
        completion_tokens: { type: string, pattern: '^[0-9]+$' }
        unknown_usage_count: { type: integer, minimum: 0 }
