openapi: 3.1.0
info:
  title: Niu API-key IP policies
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /api/v1/organizations/{organization}/projects/{project}/keys/{key}/ip-policy:
    get:
      $ref: './generated/handler-operations.json#/paths/~1api~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1ip-policy/get'
    put:
      $ref: './generated/handler-operations.json#/paths/~1api~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1ip-policy/put'
  /api/v1/organizations/{organization}/projects/{project}/keys/{key}/ip-policy/history:
    get:
      $ref: './generated/handler-operations.json#/paths/~1api~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1ip-policy~1history/get'
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer , description: "Bearer credential accepted by this operation. Inference uses a workspace API key; management requires an authorized member session or installation credential. See the operation description for required authority and scope." }
  parameters:
    Organization: { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
    Workspace: { name: project, in: path, required: true, schema: { type: string, format: uuid } }
    Key: { name: key, in: path, required: true, schema: { type: string, format: uuid } }
  schemas:
    Networks:
      type: [array, 'null']
      maxItems: 64
      items: { type: string, maxLength: 64 }
      description: IPv4/IPv6 addresses or CIDRs, normalized to network CIDRs. Null permits all; empty denies all.
    Policy:
      type: object
      required: [allowed_cidrs, revision]
      properties:
        allowed_cidrs:
          $ref: '#/components/schemas/Networks'
        revision: { type: [string, 'null'], pattern: '^[1-9][0-9]*$' }
