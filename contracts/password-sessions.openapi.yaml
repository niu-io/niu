openapi: 3.1.0
info:
  title: Niu member password sessions
  version: 1.0.0
  description: >-
    Opt-in password exchange for existing scoped members. Configure
    NIU_AUTH_PUBLIC_ORIGIN as an HTTPS origin and serve these endpoints behind
    HTTPS. Browser endpoints issue HttpOnly cookies; self-registration is not implemented.
    Installation setup credentials remain separate from member passwords.
paths:
  /admin/v1/auth/password:
    put:
      operationId: changeOwnMemberPassword
      summary: Change the signed-in member's password with current-password proof
      security:
        - bearerAuth: []
        - memberCookie: []
      description: >-
        All member roles may change their own password; installation credentials
        cannot. No target member or email is accepted. Verification uses shared
        sign-in throttling and bounded workers. Credential revision checks prevent
        concurrent resets from being overwritten. Success revokes all of this
        member's sessions atomically with audit records and requires fresh sign-in.
        Browser-cookie requests require the configured Origin and clear the cookie
        on success. Failed changes preserve sessions and do not clear the cookie.
        JSON bodies are limited to 4096 bytes. All responses are non-cacheable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [current_password, password]
              properties:
                current_password: { type: string, maxLength: 1024, writeOnly: true }
                password: { type: string, minLength: 15, maxLength: 1024, writeOnly: true }
      responses:
        '200':
          description: Password changed and sessions revoked
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revision, sign_in_required]
                properties:
                  revision: { type: integer, minimum: 1 }
                  sign_in_required: { const: true }
        '400': { description: Invalid input or password policy failure; UTF-8 byte limit is 1024 }
        '401': { description: Invalid session or incorrect current password }
        '403': { description: Installation identity or invalid browser origin }
        '409': { description: Credential revision changed during verification; no reset applied }
        '429': { description: Password verification limited; Retry-After 60 }
        '501': { description: Password authentication not configured }
        '503': { description: Password change unavailable; do not assume completion }
  /admin/v1/auth/config:
    get:
      operationId: getMemberAuthenticationCapabilities
      summary: Discover whether member password login is enabled
      security: []
      description: Returns no configured identities or credentials; responses use Cache-Control no-store.
      responses:
        '200':
          description: Public authentication capabilities
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [password_login]
                properties:
                  password_login: { type: boolean }
  /admin/v1/auth/browser/login:
    post:
      operationId: createBrowserMemberSession
      summary: Sign in with a secure HttpOnly member cookie
      security: []
      description: >-
        Requires the configured HTTPS Origin header. Uses the same password limits
        and durable throttling as bearer login. Sets __Host-niu_member_session with
        Secure, HttpOnly, SameSite=Lax, Path=/ and Max-Age=28800; no Domain.
        The response contains session metadata only, never the bearer token.
        When supplied, Sec-Fetch-Site must be a single same-origin value.
        All responses use Cache-Control no-store.
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      requestBody:
        $ref: '#/paths/~1admin~1v1~1auth~1login/post/requestBody'
      responses:
        '200':
          description: Scoped browser session created
          headers:
            Set-Cookie: { schema: { type: string }, description: Secure HttpOnly host-only member session }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [session]
                properties:
                  session: { $ref: '#/components/schemas/Session' }
        '400': { description: Invalid or oversized credentials }
        '401': { description: Incorrect email or password }
        '403': { description: Missing or mismatched Origin }
        '429': { description: Sign-in limited; Retry-After 60 }
        '501': { description: Password login not configured }
        '503': { description: Session creation unavailable }
  /admin/v1/auth/browser/logout:
    post:
      operationId: revokeBrowserMemberSession
      summary: Revoke and clear the current browser member session
      security: [{ memberCookie: [] }]
      description: >-
        Requires the configured HTTPS Origin; supplied Sec-Fetch-Site must be a single
        same-origin value. Revokes the supplied member session
        and clears the cookie. Already expired or revoked sessions also clear the
        cookie successfully. Storage failure does not claim successful revocation
        or clear the cookie. Responses use Cache-Control no-store.
      parameters:
        - in: header
          name: Origin
          required: true
          schema: { type: string }
      responses:
        '204': { description: Session unusable and cookie expired; no response body }
        '401': { description: Missing or malformed member cookie }
        '403': { description: Missing or mismatched Origin }
        '501': { description: Password login not configured }
        '503': { description: Revocation unavailable; retry before assuming sign-out }
  /admin/v1/auth/logout:
    post:
      operationId: revokeCurrentMemberSession
      summary: Sign out the member session supplied in Authorization
      security:
        - bearerAuth: []
      description: >-
        Available to every member role, independently of password login configuration.
        Revokes only the supplied active session and records a metadata-only audit
        event atomically. Other sessions remain active. Installation credentials
        are not member sessions. When password login is configured, a supplied
        Origin must match its HTTPS origin. All responses use Cache-Control no-store.
      responses:
        '204': { description: Current session revoked; no response body }
        '401': { description: Missing, invalid, expired or already revoked member session }
        '403': { description: Supplied Origin does not match the configured origin }
        '503': { description: Storage unavailable; retry sign-out before assuming revocation }
  /admin/v1/auth/login:
    post:
      operationId: createPasswordSession
      summary: Exchange member credentials for a scoped eight-hour session
      security: []
      description: >-
        JSON bodies are limited to 4096 bytes. Unknown identities and incorrect
        passwords return the same 401 response. Durable limits allow five attempts
        per normalized email and 120 per installation in windows expiring 60 seconds
        after their first attempt. A supplied Origin must match the configured
        HTTPS origin. All success and error responses are non-cacheable.
      parameters:
        - in: header
          name: Origin
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254, description: ASCII email; surrounding spaces and case are normalized. }
                password: { type: string, maxLength: 1024, description: At most 1024 UTF-8 bytes; no trimming or normalization. }
      responses:
        '200':
          description: Session token returned once; use it as a Bearer credential.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, session]
                properties:
                  token: { type: string }
                  session: { $ref: '#/components/schemas/Session' }
        '400': { description: Invalid or oversized JSON request. }
        '401': { description: Email or password is incorrect, or the member was revoked during verification. }
        '403': { description: Supplied browser Origin is not permitted. }
        '429':
          description: Durable admission limit or bounded password-worker capacity reached.
          headers:
            Retry-After: { schema: { type: string, const: '60' } }
            Cache-Control: { schema: { type: string, const: no-store } }
        '501': { description: Password sign-in has not been configured. }
        '503': { description: Durable storage or credential processing is unavailable; no session token is returned. }
  /admin/v1/operators/{operator}/password:
    put:
      operationId: setMemberPassword
      summary: Provision or reset an existing member password
      security: [{ bearerAuth: [] }]
      description: >-
        Requires installation administration or an owner permitted to manage the
        target member's scope. Admin and viewer roles cannot perform this operation.
        First provision omits expected_revision; resetting requires the previous
        returned revision. Changes revoke all previous sessions atomically and append
        metadata-only audit events. Hashes are never returned. Bodies are limited to
        4096 bytes and all success/error responses are non-cacheable.
      parameters:
        - in: path
          name: operator
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Origin
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string, maxLength: 254, description: Unique normalized ASCII email for this member identity. }
                password: { type: string, minLength: 15, maxLength: 1024, description: At most 1024 UTF-8 bytes; spaces and Unicode are preserved. }
                expected_revision: { type: [integer, 'null'], minimum: 1 }
      responses:
        '200':
          description: New credential revision; no password or hash is returned.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [revision]
                properties:
                  revision: { type: integer, minimum: 1 }
        '400': { description: Invalid email, password bounds or JSON request. }
        '401': { description: Missing, expired or revoked administrative session. }
        '403': { description: Role or supplied Origin is not permitted. }
        '404': { description: Member is outside the caller's scope. }
        '409': { description: Credential revision changed, member was revoked, or email is already assigned. }
        '429': { description: Bounded password-worker capacity reached; Retry-After is 60 seconds. }
        '501': { description: Password sign-in has not been configured. }
        '503': { description: Durable storage or credential processing is unavailable. }
components:
  securitySchemes:
    memberCookie:
      type: apiKey
      in: cookie
      name: __Host-niu_member_session
    bearerAuth: { type: http, scheme: bearer }
  schemas:
    Session:
      type: object
      additionalProperties: false
      required: [id, operator_id, expires_at_unix, revoked]
      properties:
        id: { type: string, format: uuid }
        operator_id: { type: string, format: uuid }
        expires_at_unix: { type: integer }
        revoked: { type: boolean }
