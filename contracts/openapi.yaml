  /v1/video/jobs/{id}/results/{kind}:
    get:
      operationId: retrieveVideoResult
      summary: Retrieve a bounded saved video or last frame
      description: Requires current workspace/model and compatible Guardrail access, checked again after retrieval. Uses encrypted references with a fixed 24-hour retention window. URLs may expire sooner. Never returns or redirects to a signed Provider URL. Supports MP4/WebM up to 64 MiB and PNG/JPEG up to 10 MiB; no Range support or automatic retry. Local transport tests do not qualify a live channel.
