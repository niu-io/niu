  /api/v1/models:
    get:
      operationId: adminListModels
      summary: List configured model routes
      description: Company-scoped member sessions automatically include their own enabled personal models. Installation administrators may select a company with organization_id; without it only shared models are returned. Supply project_id to select an authorized workspace and resolve its effective customer selling prices. Without workspace scope customer_pricing is null; null is not a zero price and does not establish whether a workspace has a configured tariff. Personal routes also have null customer_pricing because they do not incur a Niu customer tariff. Model metadata and prices are advisory and do not qualify paid execution. Member responses omit Provider mappings, upstream names, procurement prices and credentials. Installation responses additionally include configured Provider and upstream model mappings and expose capability flags at the row root.
      parameters:
        - name: organization_id
          in: query
          required: false
          description: Company scope. Member sessions default to their own company; installation administrators must provide this when selecting a workspace.
          schema: { type: string, format: uuid }
        - name: project_id
          in: query
          required: false
          description: Workspace scope under the legacy API field name. Must belong to the selected company and authenticated member scope. Enables effective workspace customer pricing; it does not grant access to that workspace.
          schema: { type: string, format: uuid }
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Authorized model metadata. Member and installation projections differ; customer_pricing contains customer selling rates only.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      oneOf:
                        - $ref: '#/components/schemas/MemberModelMetadata'
                        - $ref: '#/components/schemas/InstallationModelMetadata'
        '401':
          description: Missing or invalid administrator credentials.
        '404':
          description: Selected account is outside the authenticated scope.
