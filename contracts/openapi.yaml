      type: object
      required: [type, refusal]
      properties:
        type: { type: string, const: refusal }
        refusal: { type: string }
      additionalProperties: true
    ResponsesMessage:
      type: object
      required: [type, role, content]
      properties:
        id: { type: string }
        type: { type: string, const: message }
        role: { type: string, const: assistant }
        status: { type: string }
        content:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/ResponsesOutputText'
              - $ref: '#/components/schemas/ResponsesRefusal'
      additionalProperties: true
    ResponsesReasoning:
      type: object
      required: [type]
      properties:
        id: { type: string }
        type: { type: string, const: reasoning }
        summary: { type: array }
        encrypted_content: { type: string }
      additionalProperties: true
    ResponsesResponse:
      type: object
      required: [id, object, status, model, output]
      properties:
        id: { type: string, minLength: 1 }
        object: { type: string, const: response }
        status:
          type: string
          enum: [completed, incomplete]
        model: { type: string }
        output:
          type: array
          minItems: 1
          items:
            oneOf:
              - $ref: '#/components/schemas/ResponsesMessage'
              - $ref: '#/components/schemas/ResponsesReasoning'
        usage:
          type: object
          required: [input_tokens, output_tokens]
          properties:
            input_tokens: { type: integer, minimum: 0 }
            output_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
          additionalProperties: true
      additionalProperties: true
    EmbeddingRequest:
      type: object
      additionalProperties: false
      required: [model, input]
      properties:
        model: { type: string, minLength: 1 }
        input:
          oneOf:
            - type: string
              minLength: 1
            - type: array
              minItems: 1
              maxItems: 2048
              items: { type: string, minLength: 1 }
        encoding_format:
          type: string
          enum: [float, base64]
          default: float
        dimensions: { type: integer, minimum: 1, maximum: 65536 }
        user: { type: string, maxLength: 512 }
    EmbeddingResponse:
      type: object
      required: [object, data, model]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items:
            type: object
            required: [embedding]
            properties:
              object: { type: string, const: embedding }
              index: { type: integer, minimum: 0 }
              embedding:
                oneOf:
                  - type: array
                    items: { type: number }
                  - type: string
            additionalProperties: true
        model: { type: string }
        usage:
          type: object
          properties:
            prompt_tokens: { type: integer, minimum: 0 }
            total_tokens: { type: integer, minimum: 0 }
          additionalProperties: true
      additionalProperties: true
    PairedExperimentV1:
      type: object
