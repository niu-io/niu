                    type: string
                    description: Unique process/replica identifier (configured via NIU_INSTANCE_ID or generated per process startup).
                  started_at_ms:
                    type: integer
                    format: int64
                    description: Process startup timestamp in Unix milliseconds for counter-reset detection.
                  requests_total:
                    type: integer
                  requests_failed:
                    type: integer
                  prompt_tokens:
                    type: integer
                  completion_tokens:
                    type: integer
                  usage:
                    type: object
                    properties:
                      attempts_total:
                        type: integer
                      attempts_unknown:
                        type: integer
                      attempts_provider_reported:
                        type: integer
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
