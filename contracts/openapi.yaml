    get:
      $ref: './generated/handler-operations.json#/paths/~1v1~1video~1jobs~1{id}~1billing/get'
  /v1/video/jobs/{id}/timings:
    get:
      operationId: retrieveVideoTransportTimings
      summary: Read measured gateway video transport spans
      description: Same current workspace/model authorization as job reads. Returns at most the latest 100 spans in chronological order with explicit truncation. Submission/query network intervals are distinct from Provider queue/run timestamps; unavailable is a transport outcome, not a generation failure or refund. No upstream references or internal span IDs are exposed.
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Measured spans; missing observations are not invented
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data, has_more]
                properties:
                  lifecycle:
                    type: object
                    additionalProperties: false
                    required: [source, submitted_unix_ms, observations, conflicting_terminal]
                    properties:
                      source: { type: string, enum: [gateway_observation] }
                      submitted_unix_ms: { type: [integer, 'null'] }
                      conflicting_terminal: { type: boolean }
                      observations:
                        type: array
                        maxItems: 5
                        items:
                          type: object
                          additionalProperties: false
                          required: [status, observed_unix_ms]
                          properties:
                            status: { type: string, enum: [queued, running, succeeded, failed, unknown] }
                            observed_unix_ms: { type: integer }
                  has_more: { type: boolean }
                  data:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [phase, started_unix_ms, elapsed_ms, outcome]
                      properties:
                        phase: { type: string, enum: [submission, query, result], description: "Result measures retrieval transport only; received does not imply client delivery or another generation." }
                        started_unix_ms: { type: integer, minimum: 0, maximum: 9007199254740991 }
                        elapsed_ms: { type: integer, minimum: 0, maximum: 120000 }
                        outcome: { type: string, enum: [received, unavailable] }
                        upstream_http_status: { type: [integer, 'null'], minimum: 100, maximum: 599, description: "Safe HTTP failure status only; null for historical or unclassified outcomes. Does not prove generation nonexecution or authorize a refund." }
                        upstream_error_code: { type: [string, 'null'], maxLength: 128, description: "Bounded observed Provider error code; no response message or body." }
                        upstream_request_id: { type: [string, 'null'], maxLength: 200, description: "Bounded observed Provider correlation identifier for diagnostics." }
                        transport_phase: { type: [string, 'null'], enum: [connection, request, null], description: 'Observed stage only; historical unknown remains null and does not prove nonexecution.' }
        '401': { description: Invalid credential }
        '404': { description: Missing job or workspace/model access denied }
  /v1/video/jobs/{id}/refresh:
    post:
      operationId: refreshOwnerFundedVideoJob
      summary: Refresh one direct-channel video job
      description: Rechecks current workspace/model/policy access and original pinned account/route. Performs one bounded GET and applies saved status evidence. Missing references require reconciliation and never trigger a new generation. Does not expose private result URLs. Explicit refresh supports personal ownership or the original customer pricing binding. Reported successful customer usage settles the pinned price once; missing/conflicting usage retains liability. Opt-in automatic recovery includes prepaid jobs; successful jobs with missing usage or unposted liability keep recovery active. Saved successful reported usage can settle locally without another upstream query, including after key revocation; new queries still require a current key. Result retrieval and live channel qualification remain pending.
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      parameters:
