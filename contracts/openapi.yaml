  /admin/v1/vendors/{id}/asset-management:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAssetManagementConfiguration
      summary: Read installation asset-management configuration metadata
      description: Installation administrator only. Returns no Access Key, secret or ciphertext. Configuration does not enable asset dispatch.
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: Latest metadata, or null before setup. Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    anyOf:
                      - { $ref: '#/components/schemas/AssetManagementConfiguration' }
                      - { type: 'null' }
        '403': { description: Installation administrator required. }
        '404': { description: Credential configuration not found. }
    put:
      operationId: configureAssetManagement
      summary: Save an encrypted asset-management credential revision
      description: Installation administrator only. Direct Beijing Ark account required. Separate encryption binds the exact configuration, management revision and upstream project. Stale management or concurrently changed vendor revisions conflict. No upstream call, entitlement verification or dispatch activation occurs. Request body is limited to 16 KiB. Retention, revocation and lifecycle activation remain unqualified.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, upstream_project, access_key, secret_key]
              properties:
                expected_revision: { type: integer, minimum: 0, maximum: 9223372036854775806 }
                upstream_project: { type: string, minLength: 1, maxLength: 1024 }
                access_key: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
                secret_key: { type: string, minLength: 1, maxLength: 4096, writeOnly: true }
      responses:
        '200':
          description: Saved configuration metadata only; no dispatch activation.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data: { $ref: '#/components/schemas/AssetManagementConfiguration' }
        '400': { description: Invalid configuration or unavailable encryption. }
        '403': { description: Installation administrator required. }
        '404': { description: Credential configuration not found. }
        '409': { description: Stale management or changed vendor revision. }
        '413': { description: Request exceeds the configured body limit. }
    delete:
      operationId: revokeAssetManagement
      summary: Revoke locally saved asset-management credentials
      description: Installation administrator only. The expected management revision must match the latest configuration. Revocation blocks internal reads through that revision. Optional erasure removes ciphertext from the active database only and requires confirm_erase=true; immutable metadata and audit events remain. Exact repeat requests do not duplicate audit events. This does not revoke Access Keys at Ark or erase backups, and does not affect inference bearer credentials.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision]
              properties:
                expected_revision: { type: integer, minimum: 1 }
                erase_history: { type: boolean, default: false }
                confirm_erase: { type: boolean, default: false }
      responses:
        '200':
          description: Local revocation applied. erased_revisions counts ciphertext rows erased by this call, and is zero on a repeat.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [revision, configured, dispatch_available, erased_revisions]
                    properties:
                      revision: { type: integer, minimum: 1 }
                      configured: { type: boolean, const: false }
                      dispatch_available: { type: boolean, const: false }
                      erased_revisions: { type: integer, minimum: 0 }
        '400': { description: Invalid input or missing erasure confirmation. }
        '403': { description: Installation administrator required. }
        '409': { description: Missing configuration or stale revision. }
        '413': { description: Request body exceeds 16 KiB. }
  /admin/v1/vendors/{id}/asset-management/lookups:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Look up one asset from a retained original-group listing
      description: Platform administrator only. Requires current original ListAssets and separate GetAsset grants. Accepts a retained listing and zero-based item position, never an upstream identity or URL. Claims lookup_id once before egress. Four lookups execute concurrently without a queue; claimed work persists after caller disconnect. Fixed signed transport is bounded to 1 MiB and 30 seconds, with a 35-second outer deadline. No retries or billing mutation. Returns operational status only; a validated snapshot is separately encrypted for 24 hours and recovered through the saved-result endpoint. Successful transport may observe a Failed or Processing asset and never grants readiness or reuse rights.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization_id, project_id, listing_id, lookup_id, item_index]
              properties:
                organization_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
                listing_id: { type: string, format: uuid }
                lookup_id: { type: string, format: uuid }
                item_index: { type: integer, minimum: 0, maximum: 99 }
      responses:
