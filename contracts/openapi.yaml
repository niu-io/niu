    VideoModel:
      type: object
      additionalProperties: false
      required: [object, id, mode, input_types, text, maximum_body_bytes, maximum_content_items, controls, required_controls, exclusive_controls, output]
      properties:
        object: { const: video.model }
        id: { type: string, description: Customer model alias }
        mode: { type: string, enum: [owner_funded, customer] }
        input_types: { type: array, minItems: 1, maxItems: 4, uniqueItems: true, items: { enum: [text, image_url, audio_url, video_url] } }
        requires_image: { type: boolean }
        image_url:
          type: object
          additionalProperties: false
          required: [maximum_items, maximum_bytes, https, data_mime_types, roles, role_required, requires_text]
          properties:
            maximum_items: { type: integer, minimum: 1, maximum: 32 }
            maximum_bytes: { type: integer, minimum: 1 }
            https: { type: boolean }
            data_mime_types: { type: array, uniqueItems: true, items: { enum: [image/png, image/jpeg, image/webp] } }
            roles: { type: array, items: { type: string } }
            role_required: { type: boolean }
            requires_text: { type: boolean }
            maximum_width: { type: integer, minimum: 1 }
            maximum_height: { type: integer, minimum: 1 }
            maximum_decoded_bytes: { type: integer, minimum: 1 }
        audio_url: { $ref: '#/components/schemas/VideoRemoteReferenceInput' }
        video_url: { $ref: '#/components/schemas/VideoRemoteReferenceInput' }
        text:
          type: object
          additionalProperties: false
          required: [maximum_items, maximum_bytes]
          properties:
            maximum_items: { type: integer, minimum: 1, maximum: 32 }
            maximum_bytes: { type: integer, minimum: 1, maximum: 16777216 }
        maximum_body_bytes: { type: integer, minimum: 1, maximum: 16777216 }
        maximum_content_items: { type: integer, minimum: 1, maximum: 32 }
        controls:
          type: object
          additionalProperties:
            oneOf:
              - { $ref: '#/components/schemas/VideoIntegerControl' }
              - { $ref: '#/components/schemas/VideoChoiceControl' }
              - { $ref: '#/components/schemas/VideoBooleanControl' }
        required_controls: { type: array, items: { type: string } }
        exclusive_controls: { type: array, items: { type: array, minItems: 2, maxItems: 2, items: { type: string } } }
        output:
          description: Null for personal Ark models without a configured output estimate; never a free billing quote.
          type: [object, 'null']
          additionalProperties: false
          required: [specifications, meter, estimator]
          oneOf:
            - type: 'null'
            - type: object
              properties:
                meter: { const: video_tokens }
                estimator: { const: SeedancePixelsV1 }
            - type: object
              properties:
                meter: { const: seconds }
                estimator: { const: OutputSecondsV1 }
          properties:
            meter: { type: string, enum: [video_tokens, seconds] }
            estimator: { type: string, enum: [SeedancePixelsV1, OutputSecondsV1] }
            specifications: { $ref: './generated/handler-operations.json#/components/schemas/VideoOutputSchema/properties/specifications' }
    VideoSchema:
      $ref: './generated/handler-operations.json#/components/schemas/VideoSchema'
    VideoOutputSchema:
