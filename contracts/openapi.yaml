  /v1/media/image-ingestions:
    get:
      operationId: listImageIngestions
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Recover this API key's saved ingestion history
      description: Returns at most fifty newest records ordered by consent creation time and identity. Follow next_cursor as before until null. History includes revoked, expired and completed records without changing consent, publishing source capabilities or contacting an upstream service. A cursor from another key is unavailable. Later inserts do not shift continuation pages.
      parameters:
        - in: query
          name: before
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Customer-safe status array in data and nullable next_cursor; same safe fields as individual status }
        '400': { description: Invalid cursor or query }
        '401': { description: Active original API key required }
        '404': { description: Cursor unavailable under this key }
  /v1/media/image-ingestions/{id}/readiness/{read_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: read_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: refreshIngestedImageReadiness
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Observe accepted image status using its original account
      description: Separate current GetAsset permission and the original API key are required. One outstanding observation per ingestion, sixty per rolling hour and four concurrent gateway reads. One fixed bounded GetAsset request validates asset identity, group, project and image type before persisting status. The worker survives disconnect; interrupted reads record failure. This does not repeat creation, download media or grant reusable-reference rights. A claimed read_id is never replayed; use GET to inspect its saved outcome.
      requestBody:
        required: false
        description: Omit the body or send an empty JSON object. Unknown fields and other JSON values are rejected before any upstream claim.
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '400': { description: Expected an empty command object }
        '200': { description: "Persisted observation; status pending/succeeded/failed, asset_status Active/Processing/Failed or null, safe reason, duration_ms, observed_at and reuse_available false. A successful Processing observation does not imply an active asset." }
        '401': { description: Active original API key required }
        '403': { description: Current workspace authorization required }
        '409': { description: "Accepted ingestion or reviewed permission unavailable, claimed read identity, pending observation or polling limit" }
        '503': { description: "Read capacity, credentials or persistence unavailable" }
    get:
      operationId: getIngestedImageReadiness
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Retrieve one persisted readiness observation without an upstream request
      responses:
        '200': { description: "Customer-safe observation; no upstream identifiers, raw response, credentials or commercial procurement data" }
        '401': { description: Active original API key required }
        '404': { description: Observation unavailable under this key and ingestion }
  /v1/media/image-sources:
    $ref: './generated/handler-operations.json#/paths/~1v1~1media~1image-sources'
  /v1/media/image-sources/{id}:
    delete:
      operationId: eraseInspectedImageSource
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Erase this API key's retained source bytes
      description: Idempotent and opaque for absent or foreign sources. Immutable provenance remains. Does not cancel an already accepted upstream asset or erase it upstream.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Scoped source erased or unavailable; no existence disclosure }
        '401': { description: Active API key required }
  /v1/media/image-ingestions/{id}/dispatch:
    post:
      operationId: dispatchImageIngestion
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Claim and dispatch one inspected image ingestion
      description: Requires original source API key, current policy, detector terms and reviewed CreateAsset permission. A trusted configured HTTPS origin serves the exact inspected bytes using an expiring capability. Four uploads may run concurrently. The bounded worker survives client disconnect; its immutable accepted or uncertain outcome is persisted. Never automatically replay an uncertain upload. Acceptance does not mean asset readiness. No client-supplied source URL, destination override or credential is accepted.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        description: Omit the body or send an empty JSON object. Unknown fields and other JSON values are rejected before any upstream claim.
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '400': { description: Expected an empty command object }
        '200': { description: Persisted customer-safe accepted or uncertain ingestion status }
        '401': { description: Active original API key required }
        '403': { description: Current policy required }
        '409': { description: "Consent unavailable, already claimed or no longer authorized" }
        '503': { description: "Source origin or encryption unavailable, upload capacity exhausted or worker storage unavailable" }
  /v1/media/image-ingestions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: prepareImageIngestionConsent
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Consent to ingestion of one inspected image into one ordinary asset group
      description: Requires the original source API key and current workspace policy. Repeating identical unexpired consent is idempotent; consent cannot be renewed or retargeted. The dispatch_available flag requires retained unexpired source bytes, unrevoked unclaimed consent, configured source origin and encryption; it is not an admission guarantee. Erasing the source disables dispatch without rewriting consent or accepted history. This endpoint neither claims nor dispatches an upload. Dispatch requires a configured public HTTPS source origin and separate admission checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id, group_intent_id, authorization_id, valid_for_seconds, confirm_ingestion]
              properties:
                source_id: { type: string, format: uuid }
                group_intent_id: { type: string, format: uuid }
                authorization_id: { type: string, format: uuid }
                valid_for_seconds: { type: integer, minimum: 1, maximum: 900 }
                confirm_ingestion: { type: boolean, const: true }
      responses:
        '201': { description: "Consent saved; returns data with consent_id, expires_at, status, consent_revoked and dispatch_available" }
        '200': { description: Identical active consent already exists }
        '400': { description: Invalid or unconfirmed consent }
        '401': { description: Active API key required }
        '403': { description: Current workspace policy required }
        '409': { description: "Source, destination or reviewed authorization unavailable; consent conflict" }
    get:
      operationId: getImageIngestionConsent
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Read customer-safe ingestion status under the original API key
      responses:
        '200': { description: "Consent status with nullable allowlisted reason, duration_ms and observed_at from its immutable outcome; no credentials, source tokens, upstream identifiers or procurement data" }
        '401': { description: Active API key required }
        '404': { description: Consent unavailable under this API key }
    delete:
      operationId: revokeImageIngestionConsent
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Revoke source publication consent without erasing immutable history
      description: Idempotent for the original API key. Revocation does not cancel an upload already accepted upstream or resolve an uncertain outcome.
      responses:
        '204': { description: Consent revoked or already revoked }
        '401': { description: Active API key required }
        '404': { description: Consent unavailable under this API key }
  /v1/media/sources/{token}:
    head:
      $ref: './generated/handler-operations.json#/paths/~1v1~1media~1sources~1{token}/head'
    get:
      operationId: fetchInspectedImageSource
      security: []
      summary: Fetch exact approved image bytes using an expiring capability
      description: Internal Provider handoff capability, not a customer download API. The secret path token authorizes at most four deliveries within sixty seconds. Current consent, policy, detector configuration and retained content are checked on every fetch. Never log or persist the token URL. Issuance is not exposed by this API. Query parameters, request bodies and range requests are unsupported.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^nis_[a-f0-9]{64}$' }
      responses:
        '200':
          description: Exact verified image bytes; Cache-Control no-store, Referrer-Policy no-referrer and X-Content-Type-Options nosniff. No destination credentials are returned.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '400': { description: Unsupported query or request body }
        '404': { description: Opaque unavailable capability or source }
        '405': { description: Only GET is supported }
        '416': { description: Range requests are unsupported }
        '503':
          description: Transfer capacity exhausted
          headers:
            Retry-After:
              schema: { type: integer, const: 1 }
