  /api/v1/session:
    get:
      operationId: getAdminSessionIdentity
      summary: Read the current administrator's scope and permissions
      description: Revalidates the bearer credential on every request. Returns installation authority or the operator's current organization/workspace scope and role. Permissions are UI hints; every management operation independently enforces authorization. Responses contain no credentials and use Cache-Control no-store.
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Current identity and effective role permissions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [kind, operator, permissions, provider_memberships]
                    properties:
                      kind: { type: string, enum: [installation, operator] }
                      provider_memberships:
                        type: array
                        description: Explicit active Provider grants only; installation identity returns an empty array.
                        items:
                          type: object
                          required: [id, name, role]
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            role: { type: string, enum: [viewer, manager] }
                      operator:
                        type: [object, 'null']
                        required: [id, role, organization_id, project_id]
                        properties:
                          id: { type: string, format: uuid }
                          role: { type: string, enum: [owner, admin, viewer] }
                          organization_id: { type: string, format: uuid }
                          project_id: { type: [string, 'null'], format: uuid }
                      permissions:
                        type: object
                        required: [read, write, manage_operators, platform_admin]
                        properties:
                          read: { type: boolean }
                          write: { type: boolean }
                          manage_operators: { type: boolean }
                          platform_admin:
                            type: boolean
                            description: Explicit platform administration capability; does not expand customer workspace scope.
        '401':
          description: Missing, invalid, expired or revoked administrator credential.
        '503':
          description: Operator storage is unavailable.
  /api/v1/operators:
    get:
      operationId: adminListOperators
      summary: List operator identities without session credentials
      description: Requires an owner or installation administrator. Results are scoped before pagination. Installation callers may filter by organization_id; members cannot change their authorized company/workspace scope. Returns identities and roles, never session credentials. Pass next_cursor as after until null. A missing or foreign cursor returns 409. Pages are live observations ordered by creation time and identity.
      parameters:
        - { in: query, name: organization_id, schema: { type: string, format: uuid } }
        - { in: query, name: after, schema: { type: string, format: uuid } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 1000, default: 1000 } }
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Persistent operator identities and assigned roles.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  next_cursor: { type: [string, 'null'], format: uuid }
                  data:
                    type: array
                    items:
                      type: object
                      required: [id, name, role, organization_id, project_id, revoked]
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        role: { type: string, enum: [owner, admin, viewer] }
                        organization_id: { type: [string, 'null'], format: uuid }
                        project_id: { type: [string, 'null'], format: uuid }
                        revoked: { type: boolean }
        '400':
          description: Invalid page limit, cursor syntax or unknown query field.
        '404':
          description: Requested company is outside the member scope.
        '409':
          description: Cursor is missing or outside the selected scope; refresh the directory.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
    post:
      operationId: adminCreateOperator
      summary: Create an operator and issue its first session token
      description: >-
        Requires a permitted owner or installation administrator. Every user belongs
        to a company and may be workspace-scoped. By default a temporary session is
        issued once and expires_in_seconds is required. For recoverable onboarding,
        pass issue_session false with Idempotency-Key and omit expires_in_seconds.
        The identity and receipt commit together; matching retries return current
        metadata for the original identity with null session/token. Changed input,
        revoked or deleted identities return 409; replay never restores access or
        issues a credential. The receipt namespace is company-scoped, distinct from
        company/workspace creation. Authorization is checked before receipt lookup.
      parameters:
        - in: header
          name: Idempotency-Key
          description: Required only for identity-only creation; 1–128 visible ASCII characters. Retain the same key and input after an uncertain outcome.
          schema: { type: string, minLength: 1, maxLength: 128 }
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorInput'
      responses:
        '201':
          description: User created or identity-only replay confirmed; session/token are null for identity-only creation. Cache-Control no-store.
        '400':
          description: Invalid role, name or session lifetime.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
  /api/v1/operators/{operator}:
    patch:
      $ref: './generated/handler-operations.json#/paths/~1api~1v1~1operators~1{operator}/patch'
