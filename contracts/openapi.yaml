                properties:
                  data:
                    type: object
                    required: [consent_id, prepared, dispatch_available]
                    properties:
                      consent_id: { type: string, format: uuid }
                      prepared: { type: boolean, const: true }
                      dispatch_available: { type: boolean, const: false }
        '200':
          description: Identical unexpired consent retained without renewal.
          content:
            application/json:
              schema: *assetDeletionConsentPreparation
        '400': { description: Cascading confirmation missing or validity outside bounds. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Original group not found in the specified workspace and Provider configuration. }
        '409': { description: "Group or qualification unavailable, stale binding, or conflicting/expired/revoked consent." }
        '413': { description: Request exceeds 4096 bytes. }
        '422': { description: Invalid request shape or unknown fields. }
  /api/v1/vendors/{id}/asset-management/group-deletion-consents/{consent}/dispatch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: consent, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: dispatchOrdinaryAssetGroupDeletion
      summary: Dispatch one irreversible ordinary-group cascading deletion
      description: Platform administrator only. Requires separately saved explicit consent and a current exact DeleteAssetGroup grant. Rechecks original credential/configuration binding, expiry, revocation and mutation holds before committing a one-shot claim. Uses the fixed signed Ark endpoint without retries. A disconnected client does not cancel the bounded worker. Unacknowledged responses remain uncertain; neither outcome proves independent absence, releases the mutation fence or permits replay. No customer charge. Cache-Control no-store.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization_id, project_id]
              properties:
                organization_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
      responses:
        '200':
          description: Durable acknowledged or uncertain outcome; independent reconciliation remains required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [consent_id, status, reconciliation_required]
                    properties:
                      consent_id: { type: string, format: uuid }
                      status: { type: string, enum: [acknowledged, uncertain] }
                      reconciliation_required: { type: boolean, const: true }
        '400': { description: Invalid scope. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Consent does not belong to this workspace and Provider configuration. }
        '409': { description: "Ineligible or consumed consent, stale qualification or outstanding mutation hold." }
        '413': { description: Request exceeds 4096 bytes. }
        '422': { description: Invalid shape or unknown fields. }
        '503': { description: "Execution capacity, credential decryption or durable outcome unavailable. Read saved status; do not automatically retry." }
  /api/v1/vendors/{id}/asset-management/group-deletion-consents/{consent}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: consent, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: organization_id, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: project_id, in: query, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOrdinaryAssetGroupDeletionConsent
      summary: Read safe local consent and outcome status
      description: Platform administrator only. Scoped to the original workspace and Provider configuration. Returns no upstream identities, credentials, grant evidence or procurement data. Consent status alone is not current dispatch authorization. Claimed/outcome state takes precedence over later consent revocation or expiry. Does not query upstream. Cache-Control no-store.
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: Saved local consent status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, created_at, expires_at, reason, duration_ms, dispatch_available]
                    properties:
                      status: { type: string, enum: [consented, revoked, expired, unresolved, acknowledged, uncertain] }
                      created_at: { type: string, format: date-time }
                      expires_at: { type: string, format: date-time }
                      reason: { type: [string, 'null'], enum: [invalid_configuration, destination_rejected, unavailable, transport, timeout, response_limit, invalid_response, null] }
                      duration_ms: { type: [integer, 'null'], minimum: 0 }
                      dispatch_available: { type: boolean, const: false }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Consent not found in the specified scope. }
        '400': { description: Invalid scope. }
    delete:
      operationId: revokeOrdinaryAssetGroupDeletionConsent
      summary: Revoke local deletion consent without erasing history
      description: Platform administrator only. Idempotent and scoped; absent or mismatched records return 204 without changes. Does not delete an upstream group, erase claims/outcomes, cancel already dispatched work or restore consumed consent. Future claims must recheck revocation. No billing mutation.
      security: [{ adminBearerAuth: [] }]
      responses:
        '204': { description: Consent revoked or no matching consent. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '400': { description: Invalid scope. }
  /api/v1/vendors/{id}/asset-management/authorizations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createAssetOperationAuthorization
      summary: Record administrator-reviewed ordinary asset qualification
      description: Platform administrator only. Binds the exact workspace, direct Beijing Ark configuration revision and asset credential revision. The four nonzero SHA-256 references identify reviewed rights, protocol, data-handling and free-operation evidence; they do not establish entitlement automatically. Validity is bounded to 90 days. CreateAsset requires separate ingestion review and does not establish processing consent or exact inspected-content binding. DeleteAssetGroup requires its own reviewed grant and never inherits creation/read/update rights; it does not establish destructive user consent. Does not send upstream requests or enable dispatch. Request body is limited to 16 KiB.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetOperationAuthorizationInput' }
      responses:
        '201':
          description: Immutable qualification recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, operation, dispatch_available]
                    properties:
                      id: { type: string, format: uuid }
                      operation: { type: string, enum: [CreateAssetGroup, GetAssetGroup, ListAssets, GetAsset, UpdateAssetGroup, DeleteAssetGroup, CreateAsset] }
                      dispatch_available: { type: boolean, const: false }
        '400': { description: "Invalid revisions, validity or evidence references." }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Workspace does not belong to the specified organization. }
        '409': { description: "Account revision changed, account is not direct Ark, or asset credentials are missing or revoked." }
        '413': { description: Request body exceeds 16 KiB. }
        '422': { description: Invalid request shape or unknown fields. }
    get:
      operationId: listAssetOperationAuthorizations
      summary: List one account's qualification records
      description: Platform administrator only. Administrative evidence references and account bindings must not appear in customer projections. Records remain visible after expiry or revocation; presence is not proof of current authorization. Cache-Control no-store.
      security: [{ adminBearerAuth: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Bounded records ordered by routing identifier, with a cursor when more exist.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssetOperationAuthorization' }
                  next_cursor: { type: [string, 'null'], format: uuid }
        '400': { description: Invalid limit or cursor. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
  /api/v1/vendors/{id}/asset-management/authorizations/{authorization}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: authorization
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeAssetOperationAuthorization
      summary: Revoke one account's asset qualification
      description: Platform administrator only. Appends an immutable actor-attributed revocation. Missing, already revoked, and mismatched-account identifiers return the same idempotent response; another account's record is never revoked. Does not delete audit records or contact upstream.
      security: [{ adminBearerAuth: [] }]
      responses:
        '204': { description: Local revocation applied or no matching active record. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
  /api/v1/vendors/{id}/personal-owner:
