  /admin/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List resource metadata (up to 1000 records)
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: A data array of metadata, never token hashes or secrets.
        '401':
          description: Invalid administrator token.
    post:
      operationId: createOrganization
      summary: Create an organization
      description: Creates the company and an initial zero-funded balance account atomically, in the requested currency (USD when omitted), with zero approved credit. Paid requests require settled funding and a matching customer tariff. Additional billing currencies require explicit account setup; no foreign exchange is implied. Existing legacy organizations are not converted.
      security:
        - adminBearerAuth: []
