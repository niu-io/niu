    $ref: './key-ip.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1ip-policy~1history'
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/request-rate-limit:
    $ref: './key-request-rate.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1request-rate-limit'
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/request-rate-limit/history:
    $ref: './key-request-rate.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1request-rate-limit~1history'
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/concurrency-limit:
    $ref: './key-concurrency.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1concurrency-limit'
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/concurrency-limit/history:
    $ref: './key-concurrency.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1concurrency-limit~1history'
  /v1/media/image-ingestions:
    get:
      operationId: listImageIngestions
      security: [{ bearerAuth: [] }]
      summary: Recover this API key's saved ingestion history
      description: Returns at most fifty newest records ordered by consent creation time and identity. Follow next_cursor as before until null. History includes revoked, expired and completed records without changing consent, publishing source capabilities or contacting an upstream service. A cursor from another key is unavailable. Later inserts do not shift continuation pages.
      parameters:
        - in: query
          name: before
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Customer-safe status array in data and nullable next_cursor; same safe fields as individual status }
        '400': { description: Invalid cursor or query }
        '401': { description: Active original API key required }
        '404': { description: Cursor unavailable under this key }
  /v1/media/image-ingestions/{id}/readiness/{read_id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
      - in: path
        name: read_id
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: refreshIngestedImageReadiness
      security: [{ bearerAuth: [] }]
      summary: Observe accepted image status using its original account
      description: Separate current GetAsset permission and the original API key are required. One outstanding observation per ingestion, sixty per rolling hour and four concurrent gateway reads. One fixed bounded GetAsset request validates asset identity, group, project and image type before persisting status. The worker survives disconnect; interrupted reads record failure. This does not repeat creation, download media or grant reusable-reference rights. A claimed read_id is never replayed; use GET to inspect its saved outcome.
      requestBody:
        required: false
        description: Omit the body or send an empty JSON object. Unknown fields and other JSON values are rejected before any upstream claim.
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '400': { description: Expected an empty command object }
        '200': { description: "Persisted observation; status pending/succeeded/failed, asset_status Active/Processing/Failed or null, safe reason, duration_ms, observed_at and reuse_available false. A successful Processing observation does not imply an active asset." }
        '401': { description: Active original API key required }
        '403': { description: Current workspace authorization required }
        '409': { description: "Accepted ingestion or reviewed permission unavailable, claimed read identity, pending observation or polling limit" }
        '503': { description: "Read capacity, credentials or persistence unavailable" }
    get:
      operationId: getIngestedImageReadiness
      security: [{ bearerAuth: [] }]
      summary: Retrieve one persisted readiness observation without an upstream request
      responses:
        '200': { description: "Customer-safe observation; no upstream identifiers, raw response, credentials or commercial procurement data" }
        '401': { description: Active original API key required }
        '404': { description: Observation unavailable under this key and ingestion }
  /v1/media/image-sources:
    post:
      operationId: prepareInspectedImageSource
      security: [{ bearerAuth: [] }]
      summary: Inspect and temporarily retain one exact inline image
      description: Every required detector must have current workspace processing consent. Detector approval is obtained server-side; client verdicts, hashes and remote URLs are rejected. Saves authenticated encrypted approved bytes, never publishes a fetch token or dispatches an asset. Four preparations may run concurrently. Retention is capped at fifteen minutes, with separate per-workspace and installation storage ceilings. Payload logging is not supported on this endpoint.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [image, valid_for_seconds]
              properties:
                image: { type: string, maxLength: 12582912, description: "Inline PNG, JPEG or WebP base64 data URL subject to configured detector decode limits" }
                valid_for_seconds: { type: integer, minimum: 1, maximum: 900 }
      responses:
        '201': { description: "Saved source reference and retention_seconds ceiling; no plaintext, hash, credentials or public source URL" }
        '400': { description: "Invalid, oversized or unsupported input" }
        '401': { description: Active API key required }
        '403': { description: Current inspection consent or detector approval unavailable }
        '409': { description: Workspace policy changed during preparation }
        '503': { description: "Encryption, preparation capacity or storage capacity unavailable" }
  /v1/media/image-sources/{id}:
    delete:
      operationId: eraseInspectedImageSource
      security: [{ bearerAuth: [] }]
      summary: Erase this API key's retained source bytes
      description: Idempotent and opaque for absent or foreign sources. Immutable provenance remains. Does not cancel an already accepted upstream asset or erase it upstream.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Scoped source erased or unavailable; no existence disclosure }
        '401': { description: Active API key required }
  /v1/media/image-ingestions/{id}/dispatch:
    post:
      operationId: dispatchImageIngestion
      security: [{ bearerAuth: [] }]
      summary: Claim and dispatch one inspected image ingestion
      description: Requires original source API key, current policy, detector terms and reviewed CreateAsset permission. A trusted configured HTTPS origin serves the exact inspected bytes using an expiring capability. Four uploads may run concurrently. The bounded worker survives client disconnect; its immutable accepted or uncertain outcome is persisted. Never automatically replay an uncertain upload. Acceptance does not mean asset readiness. No client-supplied source URL, destination override or credential is accepted.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: false
        description: Omit the body or send an empty JSON object. Unknown fields and other JSON values are rejected before any upstream claim.
        content:
          application/json:
            schema: { type: object, additionalProperties: false, maxProperties: 0 }
      responses:
        '400': { description: Expected an empty command object }
        '200': { description: Persisted customer-safe accepted or uncertain ingestion status }
        '401': { description: Active original API key required }
        '403': { description: Current policy required }
        '409': { description: "Consent unavailable, already claimed or no longer authorized" }
        '503': { description: "Source origin or encryption unavailable, upload capacity exhausted or worker storage unavailable" }
  /v1/media/image-ingestions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: prepareImageIngestionConsent
      security: [{ bearerAuth: [] }]
      summary: Consent to ingestion of one inspected image into one ordinary asset group
      description: Requires the original source API key and current workspace policy. Repeating identical unexpired consent is idempotent; consent cannot be renewed or retargeted. The dispatch_available flag requires retained unexpired source bytes, unrevoked unclaimed consent, configured source origin and encryption; it is not an admission guarantee. Erasing the source disables dispatch without rewriting consent or accepted history. This endpoint neither claims nor dispatches an upload. Dispatch requires a configured public HTTPS source origin and separate admission checks.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_id, group_intent_id, authorization_id, valid_for_seconds, confirm_ingestion]
              properties:
                source_id: { type: string, format: uuid }
                group_intent_id: { type: string, format: uuid }
                authorization_id: { type: string, format: uuid }
                valid_for_seconds: { type: integer, minimum: 1, maximum: 900 }
                confirm_ingestion: { type: boolean, const: true }
      responses:
        '201': { description: "Consent saved; returns data with consent_id, expires_at, status, consent_revoked and dispatch_available" }
        '200': { description: Identical active consent already exists }
        '400': { description: Invalid or unconfirmed consent }
        '401': { description: Active API key required }
        '403': { description: Current workspace policy required }
        '409': { description: "Source, destination or reviewed authorization unavailable; consent conflict" }
    get:
      operationId: getImageIngestionConsent
      security: [{ bearerAuth: [] }]
      summary: Read customer-safe ingestion status under the original API key
      responses:
        '200': { description: "Consent status with nullable allowlisted reason, duration_ms and observed_at from its immutable outcome; no credentials, source tokens, upstream identifiers or procurement data" }
        '401': { description: Active API key required }
        '404': { description: Consent unavailable under this API key }
    delete:
      operationId: revokeImageIngestionConsent
      security: [{ bearerAuth: [] }]
      summary: Revoke source publication consent without erasing immutable history
      description: Idempotent for the original API key. Revocation does not cancel an upload already accepted upstream or resolve an uncertain outcome.
      responses:
        '204': { description: Consent revoked or already revoked }
        '401': { description: Active API key required }
        '404': { description: Consent unavailable under this API key }
  /v1/media/sources/{token}:
    get:
      operationId: fetchInspectedImageSource
      security: []
      summary: Fetch exact approved image bytes using an expiring capability
      description: Internal Supplier handoff capability, not a customer download API. The secret path token authorizes at most four deliveries within sixty seconds. Current consent, policy, detector configuration and retained content are checked on every fetch. Never log or persist the token URL. Issuance is not exposed by this API. Query parameters, request bodies and range requests are unsupported.
      parameters:
        - in: path
          name: token
          required: true
          schema: { type: string, pattern: '^nis_[a-f0-9]{64}$' }
      responses:
        '200':
          description: Exact verified image bytes; Cache-Control no-store, Referrer-Policy no-referrer and X-Content-Type-Options nosniff. No destination credentials are returned.
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        '400': { description: Unsupported query or request body }
        '404': { description: Opaque unavailable capability or source }
        '405': { description: Only GET is supported }
        '416': { description: Range requests are unsupported }
        '503':
          description: Transfer capacity exhausted
          headers:
            Retry-After:
              schema: { type: integer, const: 1 }
  /v1/branding:
    get:
      operationId: getPublicBranding
      security: []
      summary: Read deployment display settings
      description: Public display settings only. No audit actors, credentials or commercial configuration. Responses are not cached.
      responses:
        '200':
          description: Current display settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingConfiguration' }
  /admin/v1/platform/branding:
    get:
      operationId: getBranding
      security: [{ bearerAuth: [] }]
      summary: Read branding as a platform administrator
      responses:
        '200':
          description: Current display settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingConfiguration' }
        '401': { description: Authentication required }
        '403': { description: Platform administration required }
    put:
      operationId: saveBranding
      security: [{ bearerAuth: [] }]
      summary: Save revision-checked deployment display settings
      description: Platform administration required. Settings and immutable audit snapshot commit atomically. Empty palettes inherit NIU.IO defaults. Effective background/foreground, primary/primary-foreground, sidebar/sidebar-foreground and accent/accent-foreground pairs must each meet a 4.5-to-1 text contrast ratio in both appearances. Logo and favicon accept bounded static PNG data URLs, re-encoded before persistence. Null resets an asset to the NIU.IO default. Body limit is 450000 bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, settings]
              properties:
                expected_revision: { type: string, pattern: '^(0|[1-9][0-9]*)$', description: Current signed 64-bit nonnegative revision }
                settings: { $ref: '#/components/schemas/BrandingSettings' }
      responses:
        '200':
          description: Saved display settings and new revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BrandingConfiguration' }
        '400': { description: Invalid settings or revision }
        '401': { description: Authentication required }
        '403': { description: Platform administration required }
        '409': { description: Revision changed; read current settings before editing again }
        '413': { description: Body exceeds limit }
        '422': { description: Malformed JSON fields }
  /v1/video/models:
    get:
      operationId: listVideoModels
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      summary: Read customer-safe configured text-video capabilities
      description: Current workspace key grants, Supplier availability, personal ownership and video-compatible Guardrails apply. Omits unsupported channels/meters, callback controls and media-reference inputs. Returns only mapped output choices without credentials, upstream mappings, revisions or procurement prices. This read makes no upstream calls and does not guarantee tariffs, funds or future admission; estimate and submission recheck those independently.
      responses:
        '200':
          description: Configured text-video capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoModelList' }
        '401': { description: Invalid or inactive credential }
        '403': { description: Workspace permission denied }
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/video/models:
    get:
      operationId: listDashboardVideoModels
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string, format: uuid } }
      summary: Read customer-safe configured text-video capabilities
      description: Current workspace key grants, Supplier availability, personal ownership and video-compatible Guardrails apply. Omits unsupported channels/meters, callback controls and media-reference inputs. Returns only mapped output choices without credentials, upstream mappings, revisions or procurement prices. This read makes no upstream calls and does not guarantee tariffs, funds or future admission; estimate and submission recheck those independently.
      responses:
        '200':
          description: Configured text-video capabilities
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoModelList' }
        '401': { description: Invalid or inactive credential }
        '403': { description: Workspace permission denied }
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/video/estimate:
    post:
      operationId: estimateDashboardVideo
      summary: Estimate a configured text-video request without submission
      description: Checks current key/model, route, capability, tariff and policy access. Performs no upstream request, job creation, reservation or debit. Estimates are not binding quotes, final charges or admission guarantees. Submission rechecks current configuration and available funds. Owner-funded amounts remain null; missing output estimators and unqualified contracts are unavailable.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model, content]
              additionalProperties: true
              properties:
                model: { type: string }
                content:
                  type: array
                  minItems: 1
                  maxItems: 32
                  items:
                    type: object
                    additionalProperties: false
                    required: [type, text]
                    properties:
                      type: { const: text }
                      text: { type: string, minLength: 1 }
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Nonbinding estimate and independently reviewed maximum charge
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [object, model, mode, effective_output, estimate, maximum_charge_nanos, selected_at]
                properties:
                  object: { const: video.estimate }
                  model: { type: string }
                  mode: { type: string, enum: [owner_funded, customer] }
                  effective_output: { $ref: './generated/handler-operations.json#/components/schemas/VideoJobBilling/properties/effective_output' }
                  estimate: { $ref: './generated/handler-operations.json#/components/schemas/VideoJobBilling/properties/estimate' }
                  maximum_charge_nanos: { type: [string, 'null'], pattern: '^[0-9]+$', description: Customer maximum from separately reviewed liability; not funds reserved by this read. }
                  selected_at: { type: [string, 'null'], pattern: '^[0-9]+$', description: Customer tariff selection time in Unix seconds; does not guarantee future availability. }
        '400': { description: Request violates configured capabilities }
        '401': { description: Invalid credential }
        '403': { description: Policy cannot be satisfied }
        '404': { description: Model access denied }
        '501': { description: "Unsupported channel, meter, estimator, media or callback contract" }
        '503': { description: Qualified route or original tariff binding unavailable }
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/video/jobs:
    get:
      operationId: listDashboardVideoJobs
      summary: List durable workspace video jobs
      description: Reads saved dispatched jobs, including uncertain submissions, in newest-first creation order with an ID tie-breaker. Applies current key workspace/model grants and returns no upstream references, prompts, credentials or procurement terms. Listing does not poll or regenerate videos. Cursor jobs must remain accessible under the current key. New head entries do not move existing cursor positions.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: key, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: before, in: query, schema: { type: string, format: uuid }, description: next_before from the preceding page; scoped to currently accessible jobs. }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        '200':
          description: Saved scoped job history
          content:
