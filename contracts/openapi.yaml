  /api/v1/operators/{operator}/events:
    get:
      operationId: adminListOperatorAuditEvents
      summary: Read immutable operator and session lifecycle events
      description: Requires a scoped owner for the target operator or an installation bootstrap credential. Cursor UUIDs are accepted only when they belong to the requested target operator. Events include actor class/identity and target tenant metadata, never session tokens, token hashes or request bodies.
