    VendorModelInput:
      $ref: './generated/handler-operations.json#/components/schemas/VendorModelInput'
    VendorModel:
      $ref: './generated/handler-operations.json#/components/schemas/VendorModel'
    OperatorInput:
      type: object
      additionalProperties: false
      required: [organization_id, name, role]
      allOf:
        - if:
            required: [issue_session]
            properties: { issue_session: { const: false } }
          then: { not: { required: [expires_in_seconds] } }
          else: { required: [expires_in_seconds] }
      properties:
        issue_session: { type: boolean, default: true, description: False requires Idempotency-Key and forbids expires_in_seconds. }
        organization_id: { type: string, format: uuid }
        project_id: { type: [string, 'null'], format: uuid, description: Optional workspace-level restriction within the organization. }
        name: { type: string, minLength: 1, maxLength: 200 }
        role: { type: string, enum: [owner, admin, viewer] }
        expires_in_seconds: { type: integer, minimum: 60, maximum: 31536000 }
    OperatorSessionInput:
      type: object
      additionalProperties: false
      required: [expires_in_seconds]
      properties:
        expires_in_seconds: { type: integer, minimum: 60, maximum: 31536000 }
    OperatorAuditPage:
      type: object
      additionalProperties: false
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/OperatorAuditEvent'
        next_cursor: { type: [string, 'null'], format: uuid }
    OperatorAuditEvent:
      type: object
      additionalProperties: false
      required: [id, action, actor_kind, actor_operator_id, target_operator_id, target_session_id, organization_id, project_id, before_role, after_role, created_at]
      properties:
        id: { type: string, format: uuid }
        action: { type: string, enum: [operator_created, session_created, session_revoked, operator_revoked, password_changed, password_login_succeeded, role_changed] }
        actor_kind: { type: string, enum: [installation, operator] }
        actor_operator_id: { type: [string, 'null'], format: uuid, description: Null only for installation actors. }
        target_operator_id: { type: string, format: uuid }
        target_session_id: { type: [string, 'null'], format: uuid, description: Present for session creation, revocation and password login; role changes apply to the member and have no target session. }
        organization_id: { type: string, format: uuid }
        project_id: { type: [string, 'null'], format: uuid }
        before_role: { type: [string, 'null'], enum: [owner, admin, viewer, null], description: Recorded original role for role_changed; null for other events. }
        after_role: { type: [string, 'null'], enum: [owner, admin, viewer, null], description: Recorded new role for role_changed; null for other events. }
        created_at: { type: string, format: date-time }
    ChatFunctionTool:
      type: object
      required: [type, function]
      properties:
        type: { type: string, const: function }
        function:
          type: object
          required: [name]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 64
              pattern: '^[A-Za-z0-9_-]+$'
            description: { type: string }
            parameters:
              type: object
              description: JSON Schema object forwarded to the configured provider.
              additionalProperties: true
            strict: { type: boolean }
          additionalProperties: true
      additionalProperties: true
    ChatToolChoice:
      oneOf:
        - type: string
          enum: [none, auto, required]
        - type: object
          required: [type, function]
          properties:
            type: { type: string, const: function }
            function:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
          additionalProperties: true
    ChatResponseFormat:
      oneOf:
        - type: object
          required: [type]
          properties:
            type: { type: string, const: text }
          additionalProperties: true
        - type: object
          required: [type]
          properties:
            type: { type: string, const: json_object }
          additionalProperties: true
        - type: object
          required: [type, json_schema]
          properties:
            type: { type: string, const: json_schema }
            json_schema:
              type: object
              required: [name, schema]
              properties:
                name: { type: string, minLength: 1, maxLength: 64 }
                description: { type: string }
                strict: { type: boolean }
                schema: { type: object, additionalProperties: true }
              additionalProperties: true
          additionalProperties: true
    ResponsesRequest:
      type: object
