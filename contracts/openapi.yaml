                  pattern: '^[A-Z]{3}$'
                  default: USD
                  example: CNY
      responses:
        '201':
          description: Created. Key issuance returns id and token with Cache-Control no-store; other resources return id and name.
        '401':
          description: Invalid installation administrator token.
