      responses:
        '200':
          description: Attachment with private no-store caching and nosniff headers
          content:
            video/mp4: { schema: { type: string, format: binary } }
            video/webm: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        '400': { description: Unknown result kind }
        '401': { description: "Invalid, expired or revoked key" }
        '403': { description: Required policy cannot be satisfied }
        '404': { description: "Inaccessible, missing, locally expired or deleted reference" }
        '502': { description: 'Safe media_result_* error category for unavailable links, rejected destinations, oversized or invalid media, or transport failure' }
        '503': { description: "Encryption, configuration or bounded retrieval capacity unavailable; capacity errors use media_result_busy" }
        '504': { description: Overall result retrieval deadline exceeded; media_result_timeout }
  /v1/video/jobs/{id}/results:
    get:
      operationId: getVideoResultsStatus
      summary: Read saved result availability without downloading media
      description: Requires current scoped model and compatible policy access. Returns no URLs or media content. Missing means no captured reference; unavailable includes expiry, deletion or conflicting terminal evidence. No regeneration, download or automatic query is performed.
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Current saved availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoResultAvailability' }
        '401': { description: Invalid credential }
        '403': { description: Workspace or policy access denied }
        '404': { description: Missing or inaccessible job }
    delete:
      operationId: deleteVideoResults
      summary: Permanently remove locally saved result references
      description: Requires current workspace/model access. Removes encrypted URLs and leaves content-free markers preventing later refresh from restoring them, including unfinished jobs. Preserves status and financial records. Does not delete media held by a Provider or downloaded copies.
      security: [{ bearerAuth: [] }, { niuApiKeyAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Result references deleted
          content:
            application/json:
              schema: { type: object, additionalProperties: false, required: [deleted], properties: { deleted: { const: true } } }
        '401': { description: "Invalid, expired or revoked key" }
        '404': { description: Inaccessible or missing job }
