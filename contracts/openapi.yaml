            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, status]
                    properties:
                      id: { type: string, format: uuid, description: Saved request routing identifier; never a display label. }
                      status: { type: string, enum: [dispatching, uncertain, succeeded] }
        '400': { description: "Invalid ordinary name, description or revisions." }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Workspace does not belong to the specified organization. }
        '409': { description: "Missing or changed qualification/credentials/account, conflicting idempotency binding, or a concurrent claim. No automatic replay is permitted." }
        '413': { description: Request body exceeds 16 KiB. }
        '422': { description: Invalid shape or unknown fields. }
        '503': { description: Asset management capacity or encrypted credentials unavailable. No send was admitted by this request. }
  /admin/v1/vendors/{id}/asset-management/group-deletion-consents:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: prepareOrdinaryAssetGroupDeletionConsent
      summary: Record specific cascading-deletion consent without dispatch
      description: Platform administrator only. Requires explicit irreversible cascading confirmation for a successful saved ordinary group and its exact current DeleteAssetGroup qualification. Consent is immutable, actor-bound and limited to 900 seconds or the grant expiry, whichever is earlier. Identical replay does not renew expiry; changed, expired or revoked consent conflicts. No upstream deletion, credential release or billing mutation. Body is limited to 4096 bytes.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization_id, project_id, intent_id, consent_id, authorization_id, valid_for_seconds, confirm_cascade]
              properties:
                organization_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
                intent_id: { type: string, format: uuid }
                consent_id: { type: string, format: uuid }
                authorization_id: { type: string, format: uuid }
                valid_for_seconds: { type: integer, minimum: 1, maximum: 900 }
                confirm_cascade: { type: boolean, const: true }
      responses:
        '201':
          description: Consent recorded; no upstream dispatch.
          content:
            application/json:
              schema: &assetDeletionConsentPreparation
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [consent_id, prepared, dispatch_available]
                    properties:
                      consent_id: { type: string, format: uuid }
                      prepared: { type: boolean, const: true }
                      dispatch_available: { type: boolean, const: false }
        '200':
          description: Identical unexpired consent retained without renewal.
          content:
            application/json:
              schema: *assetDeletionConsentPreparation
        '400': { description: Cascading confirmation missing or validity outside bounds. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Original group not found in the specified workspace and Supplier configuration. }
        '409': { description: "Group or qualification unavailable, stale binding, or conflicting/expired/revoked consent." }
        '413': { description: Request exceeds 4096 bytes. }
        '422': { description: Invalid request shape or unknown fields. }
  /admin/v1/vendors/{id}/asset-management/group-deletion-consents/{consent}/dispatch:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: consent, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: dispatchOrdinaryAssetGroupDeletion
      summary: Dispatch one irreversible ordinary-group cascading deletion
      description: Platform administrator only. Requires separately saved explicit consent and a current exact DeleteAssetGroup grant. Rechecks original credential/configuration binding, expiry, revocation and mutation holds before committing a one-shot claim. Uses the fixed signed Ark endpoint without retries. A disconnected client does not cancel the bounded worker. Unacknowledged responses remain uncertain; neither outcome proves independent absence, releases the mutation fence or permits replay. No customer charge. Cache-Control no-store.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization_id, project_id]
              properties:
                organization_id: { type: string, format: uuid }
                project_id: { type: string, format: uuid }
      responses:
        '200':
          description: Durable acknowledged or uncertain outcome; independent reconciliation remains required.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [consent_id, status, reconciliation_required]
                    properties:
                      consent_id: { type: string, format: uuid }
                      status: { type: string, enum: [acknowledged, uncertain] }
                      reconciliation_required: { type: boolean, const: true }
        '400': { description: Invalid scope. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Consent does not belong to this workspace and Supplier configuration. }
        '409': { description: "Ineligible or consumed consent, stale qualification or outstanding mutation hold." }
        '413': { description: Request exceeds 4096 bytes. }
        '422': { description: Invalid shape or unknown fields. }
        '503': { description: "Execution capacity, credential decryption or durable outcome unavailable. Read saved status; do not automatically retry." }
  /admin/v1/vendors/{id}/asset-management/group-deletion-consents/{consent}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: consent, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: organization_id, in: query, required: true, schema: { type: string, format: uuid } }
      - { name: project_id, in: query, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getOrdinaryAssetGroupDeletionConsent
      summary: Read safe local consent and outcome status
      description: Platform administrator only. Scoped to the original workspace and Supplier configuration. Returns no upstream identities, credentials, grant evidence or procurement data. Consent status alone is not current dispatch authorization. Claimed/outcome state takes precedence over later consent revocation or expiry. Does not query upstream. Cache-Control no-store.
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: Saved local consent status.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status, created_at, expires_at, reason, duration_ms, dispatch_available]
                    properties:
                      status: { type: string, enum: [consented, revoked, expired, unresolved, acknowledged, uncertain] }
                      created_at: { type: string, format: date-time }
                      expires_at: { type: string, format: date-time }
                      reason: { type: [string, 'null'], enum: [invalid_configuration, destination_rejected, unavailable, transport, timeout, response_limit, invalid_response, null] }
                      duration_ms: { type: [integer, 'null'], minimum: 0 }
                      dispatch_available: { type: boolean, const: false }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Consent not found in the specified scope. }
        '400': { description: Invalid scope. }
    delete:
      operationId: revokeOrdinaryAssetGroupDeletionConsent
      summary: Revoke local deletion consent without erasing history
      description: Platform administrator only. Idempotent and scoped; absent or mismatched records return 204 without changes. Does not delete an upstream group, erase claims/outcomes, cancel already dispatched work or restore consumed consent. Future claims must recheck revocation. No billing mutation.
      security: [{ adminBearerAuth: [] }]
      responses:
        '204': { description: Consent revoked or no matching consent. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '400': { description: Invalid scope. }
  /admin/v1/vendors/{id}/asset-management/authorizations:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: createAssetOperationAuthorization
      summary: Record administrator-reviewed ordinary asset qualification
      description: Platform administrator only. Binds the exact workspace, direct Beijing Ark configuration revision and asset credential revision. The four nonzero SHA-256 references identify reviewed rights, protocol, data-handling and free-operation evidence; they do not establish entitlement automatically. Validity is bounded to 90 days. CreateAsset requires separate ingestion review and does not establish processing consent or exact inspected-content binding. DeleteAssetGroup requires its own reviewed grant and never inherits creation/read/update rights; it does not establish destructive user consent. Does not send upstream requests or enable dispatch. Request body is limited to 16 KiB.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetOperationAuthorizationInput' }
      responses:
        '201':
          description: Immutable qualification recorded.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [id, operation, dispatch_available]
                    properties:
                      id: { type: string, format: uuid }
                      operation: { type: string, enum: [CreateAssetGroup, GetAssetGroup, ListAssets, GetAsset, UpdateAssetGroup, DeleteAssetGroup, CreateAsset] }
                      dispatch_available: { type: boolean, const: false }
        '400': { description: "Invalid revisions, validity or evidence references." }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
        '404': { description: Workspace does not belong to the specified organization. }
        '409': { description: "Account revision changed, account is not direct Ark, or asset credentials are missing or revoked." }
        '413': { description: Request body exceeds 16 KiB. }
        '422': { description: Invalid request shape or unknown fields. }
    get:
      operationId: listAssetOperationAuthorizations
      summary: List one account's qualification records
      description: Platform administrator only. Administrative evidence references and account bindings must not appear in customer projections. Records remain visible after expiry or revocation; presence is not proof of current authorization. Cache-Control no-store.
      security: [{ adminBearerAuth: [] }]
      parameters:
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        '200':
          description: Bounded records ordered by routing identifier, with a cursor when more exist.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssetOperationAuthorization' }
                  next_cursor: { type: [string, 'null'], format: uuid }
        '400': { description: Invalid limit or cursor. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
  /admin/v1/vendors/{id}/asset-management/authorizations/{authorization}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: authorization
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: revokeAssetOperationAuthorization
      summary: Revoke one account's asset qualification
      description: Platform administrator only. Appends an immutable actor-attributed revocation. Missing, already revoked, and mismatched-account identifiers return the same idempotent response; another account's record is never revoked. Does not delete audit records or contact upstream.
      security: [{ adminBearerAuth: [] }]
      responses:
        '204': { description: Local revocation applied or no matching active record. }
        '401': { description: Authentication required. }
        '403': { description: Platform administrator required. }
  /admin/v1/vendors/{id}/personal-owner:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: assignPersonalCredentialOwner
      summary: Assign a configured personal credential to its account
      description: Installation administrator only. Ownership is immutable. Exact retries return success without another audit event. This does not activate Supplier offers, grant funds or qualify commercial supply. Initial assignment rejects credentials with any model route pricing, including disabled mappings; explicitly clear those prices first. Ownership assignment and model publication serialize on the credential row.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [organization_id, expected_revision]
              properties:
                organization_id: { type: string, format: uuid }
                expected_revision: { type: integer, format: int64, minimum: 1 }
      responses:
        '200':
          description: Personal owner assigned or exact assignment already exists.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [assigned]
                properties:
                  assigned: { type: boolean, const: true }
        '400': { description: Invalid assignment input. }
        '401': { description: Authentication required. }
        '403': { description: Installation administrator required. }
        '409': { description: "Stale revision, different owner, existing model route pricing, commercial qualification or unavailable account." }
  /admin/v1/vendors/{id}/models:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1vendors~1{id}~1models'
  /admin/v1/vendors/{id}/catalog:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1vendors~1{id}~1catalog'
  /admin/v1/vendors/{id}/check:
    $ref: './generated/handler-operations.json#/paths/~1admin~1v1~1vendors~1{id}~1check'
  /admin/v1/session:
    get:
      operationId: getAdminSessionIdentity
      summary: Read the current administrator's scope and permissions
      description: Revalidates the bearer credential on every request. Returns installation authority or the operator's current organization/project scope and role. Permissions are UI hints; every management operation independently enforces authorization. Responses contain no credentials and use Cache-Control no-store.
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Current identity and effective role permissions.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [kind, operator, permissions, provider_memberships]
                    properties:
                      kind: { type: string, enum: [installation, operator] }
                      provider_memberships:
                        type: array
                        description: Explicit active supplier grants only; installation identity returns an empty array.
                        items:
                          type: object
                          required: [id, name, role]
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            role: { type: string, enum: [viewer, manager] }
                      operator:
                        type: [object, 'null']
                        required: [id, role, organization_id, project_id]
                        properties:
                          id: { type: string, format: uuid }
                          role: { type: string, enum: [owner, admin, viewer] }
                          organization_id: { type: string, format: uuid }
                          project_id: { type: [string, 'null'], format: uuid }
                      permissions:
                        type: object
                        required: [read, write, manage_operators, platform_admin]
                        properties:
                          read: { type: boolean }
                          write: { type: boolean }
                          manage_operators: { type: boolean }
                          platform_admin:
                            type: boolean
                            description: Explicit platform administration capability; does not expand customer workspace scope.
        '401':
          description: Missing, invalid, expired or revoked administrator credential.
        '503':
          description: Operator storage is unavailable.
  /admin/v1/operators:
    get:
      operationId: adminListOperators
      summary: List operator identities without session credentials
      description: Requires a workspace owner or a configured bootstrap administrator token. Results are limited to the caller's organization/project unless the caller uses installation bootstrap credentials. Responses contain session identifiers and expiry metadata but never token hashes or bearer tokens.
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Persistent operator identities and assigned roles.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
    post:
      operationId: adminCreateOperator
      summary: Create an operator and issue its first session token
      description: Requires a workspace owner or a configured bootstrap administrator token. Every operator must be bound to an organization and may optionally be limited to one project. The bearer token is returned once and is never retrievable from list APIs.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorInput'
      responses:
        '201':
          description: Operator and session created; response includes Cache-Control no-store.
        '400':
          description: Invalid role, name or session lifetime.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
  /admin/v1/operators/{operator}:
    delete:
      operationId: adminRevokeOperator
      summary: Revoke an operator and all of its sessions
      security:
        - adminBearerAuth: []
      parameters:
        - name: operator
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Operator and active sessions revoked.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
        '409':
          description: Operator was already revoked or does not exist.
  /admin/v1/operators/{operator}/sessions:
    get:
      operationId: adminListOperatorSessions
      summary: List session expiry and revocation metadata
      security:
        - adminBearerAuth: []
      parameters:
        - name: operator
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Session identifiers and expiry metadata; credentials are never returned.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
    post:
      operationId: adminIssueOperatorSession
      summary: Issue an additional one-time operator session token
      security:
        - adminBearerAuth: []
      parameters:
        - name: operator
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorSessionInput'
      responses:
        '201':
          description: Session created; response includes Cache-Control no-store and the token is shown once.
        '400':
          description: Session lifetime is outside the supported range.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
        '409':
          description: Operator is unavailable.
  /admin/v1/operators/{operator}/sessions/{session}:
    delete:
      operationId: adminRevokeOperatorSession
      summary: Revoke one operator session
      security:
        - adminBearerAuth: []
      parameters:
        - name: operator
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: session
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: Session revoked.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
        '409':
          description: Session was already revoked or does not exist.
  /admin/v1/operators/{operator}/events:
    get:
      operationId: adminListOperatorAuditEvents
      summary: Read immutable operator and session lifecycle events
      description: Requires a scoped owner for the target operator or an installation bootstrap credential. Cursor UUIDs are accepted only when they belong to the requested target operator. Events include actor class/identity and target tenant metadata, never session tokens, token hashes or request bodies.
      security:
        - adminBearerAuth: []
      parameters:
        - name: operator
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: cursor
          in: query
          description: UUID from next_cursor in the previous page for this same operator.
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Events in stable descending created_at/id order and a nullable next_cursor.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorAuditPage'
        '400':
          description: Page limit is outside 1–100 or cursor is absent from this operator's event stream.
        '401':
          description: Missing, invalid, expired or revoked credentials.
        '403':
          description: The authenticated operator is not an owner.
        '404':
          description: Target operator is absent or outside the caller's scope.
  /admin/v1/metrics:
    get:
      operationId: adminGetMetrics
      summary: Read in-process request and token counters
      security:
        - adminBearerAuth: []
      responses:
        '200':
          description: Process-local counters. Token totals cover only complete provider-reported usage. Unknown attempts include missing or invalid usage, failures, cancellations, native adapter calls without usage provenance, and streams without trustworthy usage/termination evidence. Durable attempt evidence is stored separately; this metrics endpoint is process-local.
          content:
            application/json:
              schema:
                type: object
                properties:
                  requests_total:
                    type: integer
                  requests_failed:
                    type: integer
                  prompt_tokens:
                    type: integer
                  completion_tokens:
                    type: integer
                  usage:
                    type: object
                    properties:
                      attempts_total:
                        type: integer
                      attempts_unknown:
                        type: integer
                      attempts_provider_reported:
                        type: integer
                      prompt_tokens:
                        type: integer
                      completion_tokens:
                        type: integer
  /admin/v1/benchmarks/compare:
    post:
      operationId: analyzePairedBenchmark
      summary: Analyze a matched, opt-in paired benchmark dataset
      description: Stateless analysis of imported execution records and settled amounts. Accepts an installation administrator or a scoped operator with read permission. Submitted datasets are not bound to the caller's tenant or checked against stored evidence; this endpoint is not an Enterprise authorization boundary. This operation never dispatches model work, reserves budget, or persists a report.
      security:
        - adminBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PairedExperimentV1'
      responses:
