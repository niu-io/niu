  /admin/v1/organizations/{organization}/projects/{project}/accounts/{account}/quota:
    get:
      operationId: getAccountQuota
      summary: Read latest quota observations and freshness
      security:
        - adminBearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: account
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Latest quota sample for each provider window. Freshness and reset timestamps remain explicit; BIGINT quantities are decimal strings for JavaScript precision.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/QuotaWindowViewV1' }
        '401':
          description: Invalid administrator token.
    post:
      operationId: importAccountQuotaObservation
      summary: Import a versioned provider quota window observation
      description: Records an observation only. It does not call the provider, dispatch inference, or reset provider allowance. Exact replay returns the original ID; a different payload for the same account, window, and observation timestamp returns 409.
      security:
        - adminBearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: account
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/QuotaObservationV1' }
      responses:
        '201':
          description: Observation persisted.
        '400':
          description: Invalid or future observation.
        '401':
          description: Invalid administrator token.
        '409':
          description: Duplicate observation for this provider window and timestamp.
    delete:
      operationId: deleteAccountQuotaWindowHistory
      summary: Delete imported samples for one provider quota window
      description: Permanently removes every imported sample for the selected account window, including its comparison baseline. It does not call the provider, change account state, alter inference attempts, or modify the cost ledger.
      security:
        - adminBearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: account
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: window_key
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '200':
          description: Window history removed. The response includes the number of samples deleted; repeating the same request deletes zero additional samples.
          content:
            application/json:
              schema:
                type: object
                required: [window_key, deleted_count]
                properties:
                  window_key: { type: string }
                  deleted_count: { type: integer, minimum: 0 }
        '400':
          description: Missing or invalid window key.
        '401':
          description: Invalid administrator token.
        '409':
          description: Supplier account is not in the requested project.
