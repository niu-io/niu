        evaluator_api_equivalent_nanos: { type: string, pattern: '^[0-9]+$' }
        total_api_equivalent_nanos: { type: string, pattern: '^[0-9]+$' }
        cash_nanos: { type: string, pattern: '^[0-9]+$' }
        evaluator_cash_nanos: { type: string, pattern: '^[0-9]+$' }
        total_cash_nanos: { type: string, pattern: '^[0-9]+$' }
        observed_latency_p50_ms: { type: [integer, 'null'], minimum: 0 }
