  /admin/v1/organizations/{organization}/projects/{project}/budget:
    post:
      operationId: createProjectBudget
      summary: Create a platform upstream cost budget (installation only)
      description: Fails with conflict if a budget exists. Previously dispatched work is not retroactively reserved. Further dispatch requires a trusted held reservation; configure pricing separately in the model route.
      security:
        - adminBearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currency, limit_nanos]
              properties:
                currency: { type: string, pattern: '^[A-Z]{3}$' }
                limit_nanos:
                  type: string
                  pattern: '^[0-9]+$'
                  description: Nonnegative integer billionths of currency, at most 9223372036854775807.
      responses:
        '201':
          description: Created budget snapshot with decimal-string amounts and lifetime period.
        '400':
          description: Invalid currency or amount.
        '401':
          description: Administrator authentication required.
        '409':
          description: Budget already exists or the project is absent from the organization.
        '422':
          description: JSON does not match the required schema.
    get:
      operationId: getProjectBudget
      summary: Read the platform upstream cost budget (installation only)
      security:
        - adminBearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Budget data or null. limit_nanos, reserved_nanos and spent_nanos are exact decimal strings in billionths of currency. A null budget is not a zero limit.
        '401':
          description: Administrator authentication required.
        '400':
          description: Invalid path or query parameter.
  /admin/v1/organizations/{organization}/projects/{project}/costs:
    get:
      operationId: listProjectCosts
      summary: Read platform upstream cost entries (installation only)
      security:
        - adminBearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Data and nullable next_cursor. Monetary and token values are decimal strings. API-equivalent and cash charges remain distinct. Unsettled attempts are excluded; an empty page does not prove zero incurred cost. Traversal is a live view ordered by attempt UUID, not chronological or a snapshot.
        '401':
          description: Administrator authentication required.
        '400':
          description: Invalid path or query parameter.
  /admin/v1/organizations/{organization}/projects/{project}/requests:
    get:
      operationId: listProjectGatewayActivity
      summary: Read automatically retained gateway request activity
      description: Returns metadata for model attempts admitted by Niu, newest first. Request and response bodies, prompts and completions are not included. Pages are bounded to at most 100 entries. Pass the previous response's next_cursor as after to read older matching entries; traversal is a live view, not a cross-page snapshot. Optional filters apply to the whole project scope. summary totals cover the selected filters independent of page. An absent task_id means the caller did not supply X-Niu-Task-ID. Missing usage remains unknown. Operator responses omit currency, cash_nanos, api_equivalent_nanos, unknown_cost_count and settled_costs; these upstream financial fields are installation-only. Customer charges are available through Billing.
      security:
        - adminBearerAuth: []
      parameters:
        - name: organization
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: after
          in: query
          description: Exclusive cursor from the previous page's next_cursor; results are older than this attempt.
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: from_ms
          in: query
          description: Inclusive creation-time lower bound as Unix epoch milliseconds.
          schema: { type: integer, format: int64 }
        - name: to_ms
          in: query
          description: Exclusive creation-time upper bound as Unix epoch milliseconds.
          schema: { type: integer, format: int64 }
        - name: model_alias
          in: query
          description: Exact public model alias filter.
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: key_id
          in: query
          description: Project API key ID filter. Key names and IDs are visible only within the authorized project.
          schema: { type: string, format: uuid }
        - name: status
          in: query
          description: Exact gateway execution state.
          schema: { type: string, enum: [not_sent, may_have_executed, confirmed_completed, confirmed_not_executed] }
      responses:
        '200':
          description: Gateway activity wrapped in data, nullable next_cursor, and summary. Each entry includes attempt_id, operation_id, optional project api_key_id/key_name and task_id, an optional summary of the latest supplemental execution record for that task, public model alias and nullable provider-reported model, creation/dispatch/completion times, duration_ms, execution status, usage confidence, nullable prompt/completion token counts, and nullable currency/cash/API-equivalent amounts. Integer quantities and amounts are decimal strings. Pages are newest first; next_cursor is the last attempt_id when older matching entries remain. summary covers all rows matching the filters, not only the current page.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor, summary]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GatewayActivity'
                  next_cursor:
                    type: [string, 'null']
                    format: uuid
                  summary:
                    type: object
                    required: [request_count, usage_count, prompt_tokens, completion_tokens, timing_count, average_duration_ms]
                    properties:
                      request_count: { type: integer, format: int64 }
                      usage_count: { type: integer, format: int64 }
                      prompt_tokens: { type: string, pattern: '^[0-9]+$' }
                      completion_tokens: { type: string, pattern: '^[0-9]+$' }
                      timing_count: { type: integer, format: int64 }
                      average_duration_ms: { type: [integer, 'null'], minimum: 0 }
                      unknown_cost_count: { type: integer, format: int64, description: Requests without a settled cost entry; never implies zero cost. }
                      settled_costs:
                        type: array
                        items:
                          type: object
                          required: [currency, cash_nanos, api_equivalent_nanos, settled_requests]
                          properties:
                            currency: { type: string, pattern: '^[A-Z]{3}$' }
                            cash_nanos: { type: string, pattern: '^[0-9]+$' }
                            api_equivalent_nanos: { type: string, pattern: '^[0-9]+$' }
                            settled_requests: { type: integer, format: int64 }
        '401':
          description: Administrator authentication required.
        '400':
          description: Invalid path or query parameter.
