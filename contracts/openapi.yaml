      description: Requires workspace write access. Uses compare-and-swap revision checks; clearing retains a revision to prevent stale recreation. Unknown fields are rejected. A referenced conversation must belong to the same actor and workspace. Requests are limited to 24 MiB; configured browser origins are checked. No credentials or client accounting fields are accepted, but secrets deliberately embedded in prompt or file content are not detected. Responses use Cache-Control no-store.
