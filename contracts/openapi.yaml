                          name: { type: string, minLength: 1, maxLength: 1024 }
                          type: { type: string, enum: [image, text] }
                          content: { type: string, description: At most 6 MiB of UTF-8 content }
                    settings:
                      type: object
                      additionalProperties: false
                      required: [systemPrompt, maxTokens, temperature, logPayloads]
                      properties:
                        systemPrompt: { type: string, maxLength: 12000 }
                        maxTokens: { type: integer, minimum: 1, maximum: 9007199254740991 }
                        temperature: { type: number, minimum: 0, maximum: 2 }
                        logPayloads: { type: boolean }
      responses:
