      operationId: exportChatSession
      summary: Export one owned saved conversation
      description: Requires workspace read access and the authenticated conversation owner. Reads durable content directly, including sessions outside the latest-100 list. Excludes internal identifiers, settings, diagnostic errors and accounting. Conversation and attachment content is deliberately included and may contain user-supplied sensitive text. Legacy single-turn sessions become one turn. Does not export request Logs or billing evidence.
      security: [{ adminBearerAuth: [] }]
      responses:
        '200':
          description: Portable conversation JSON
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [format, version, turns]
                properties:
                  format: { const: niu-chat }
                  version: { const: 1 }
                  title: { type: string }
                  createdAt: { type: integer, minimum: 0, maximum: 9007199254740991 }
                  turns:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [prompt, results]
                      properties:
                        prompt: { type: string }
                        results:
                          type: array
                          maxItems: 4
                          items:
                            type: object
                            additionalProperties: false
                            required: [model, content, phase]
                            properties:
                              model: { type: string }
                              content: { type: string }
                              phase: { type: string, enum: [connecting, streaming, complete, failed, cancelled] }
                        attachments:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required: [name, type, content]
                            properties:
                              name: { type: string }
                              type: { type: string }
                              content: { type: string }
        '401': { description: Authentication required }
        '403': { description: Workspace read access required }
        '404': { description: No saved conversation for this workspace and owner }
        '503': { description: Durable storage unavailable }
  /admin/v1/organizations/{organization}/projects/{project}/guardrails/denials:
    $ref: './guardrails.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1guardrails~1denials'
  /admin/v1/organizations/{organization}/projects/{project}/chat-sessions/{id}:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: saveChatSession
      summary: Save an owned Chat session in a workspace
      description: Requires workspace write access. Stores conversation content separately from accounting. Only supported top-level and nested fields are retained. Client-supplied accounting fields are discarded. Numeric timestamps, durations and token counts must be nonnegative JavaScript-safe integers; token counts may be null. Settings and attachment shapes are validated. This endpoint does not establish authoritative request charges or detect secrets embedded in conversation text.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [prompt, results, createdAt]
              properties:
                prompt: { type: string }
                title: { type: string }
                createdAt: { type: integer, minimum: 0, maximum: 9007199254740991 }
                turns:
                  type: array
                  maxItems: 100
                  description: Ordered conversation turns. Each retains its prompt and up to four model responses, validated with the same result fields as the current turn. Unknown turn/result fields are stripped. Optional for legacy single-turn sessions.
                  items:
                    type: object
                    required: [prompt, results]
                    properties:
                      prompt: { type: string }
                      results:
                        type: array
                        maxItems: 4
                        items: { type: object }
                      attachments:
                        type: array
                        items:
                          type: object
                          required: [name, type, content]
                          properties:
                            name: { type: string }
                            type: { type: string }
                            content: { type: string }
                results:
                  type: array
                  maxItems: 4
                  items:
                    type: object
                    required: [model, content, elapsedMs, phase]
                    properties:
                      model: { type: string }
                      content: { type: string }
                      elapsedMs: { type: integer, minimum: 0, maximum: 9007199254740991 }
                      phase: { type: string, enum: [connecting, streaming, complete, failed, cancelled] }
                      promptTokens: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
                      completionTokens: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
                      totalTokens: { type: [integer, 'null'], minimum: 0, maximum: 9007199254740991 }
                settings:
                  type: object
                  properties:
                    systemPrompt: { type: string }
                    maxTokens: { type: integer, minimum: 1 }
                    temperature: { type: number, minimum: 0, maximum: 2 }
                    logPayloads: { type: boolean }
                attachments:
                  type: array
                  items:
                    type: object
                    required: [name, type, content]
                    properties:
                      name: { type: string }
                      type: { type: string }
                      content: { type: string }
      responses:
        '200': { description: Session saved. }
        '400': { description: Invalid conversation fields. }
        '401': { description: Authentication required. }
        '403': { description: Workspace write access required. }
        '413': { description: Request exceeds the 24 MiB transport limit. }
    delete:
      operationId: deleteChatSession
      summary: Delete an owned Chat session in a workspace
      description: Requires write access to the workspace. Deletion is scoped to the authenticated owner and workspace. Missing or already deleted sessions return the same result without disclosing another owner's history. Does not delete request accounting or billing records.
      security: [{ adminBearerAuth: [] }]
      responses:
        '204': { description: Session deleted or absent. }
        '401': { description: Authentication required. }
        '403': { description: Workspace write access required. }
  /admin/v1/organizations/{organization}/projects/{project}/chat-sessions:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: listChatSessions
      summary: List the authenticated owner's recent Chat sessions
      parameters:
        - { name: archived, in: query, schema: { type: boolean, default: false }, description: Select archived history instead of active history. }

      description: Returns up to 100 saved sessions, ordered by most recently updated, scoped to the authenticated owner and workspace. Result customerChargeNanos, customerChargeCurrency and customerChargeStatus are derived from the workspace customer ledger for matching attempt/model references, including nested turns. Amounts are exact decimal nanounit strings; statuses are charged, owner_funded, pending, unpriced or not_charged. owner_funded identifies a dispatched request using the account owner's API credential without a Niu customer debit; it does not assert an upstream payment amount. Missing or mismatched references remain unknown. Saved browser costs and Supplier expenses are omitted.
      security: [{ adminBearerAuth: [] }]
      responses:
        '200': { description: Saved sessions in the data array. }
        '401': { description: Authentication required. }
        '403': { description: Workspace read access required. }
  /admin/v1/organizations/{organization}/projects/{project}/chat-sessions/{id}/archive:
    parameters:
      - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setChatSessionArchived
      summary: Archive or restore the authenticated owner's Chat session
      description: Updates backend-owned archive state without changing content or conversation ordering. Autosaves preserve archive state. Repeating the same value is idempotent.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [archived]
              properties:
                archived: { type: boolean }
      responses:
        '204': { description: Archive state saved. }
        '400': { description: Invalid input. }
        '401': { description: Authentication required. }
        '403': { description: Workspace write access required. }
        '404': { description: No session in the caller's owner and workspace scope. }
  /admin/v1/vendors/{id}/supplier:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read explicit Supplier ownership of an API configuration
      description: Installation administration only. Returns business identity/name or null, never credentials or procurement values.
      security: [{ adminBearerAuth: [] }]
      responses:
        '200': { description: Ownership or null in the data field. }
        '401': { description: Authentication required. }
        '403': { description: Installation access required. }
    put:
      summary: Associate an API configuration with an existing Supplier
      description: Installation-only, atomic and audited. Same-Supplier retries are idempotent; reassignment conflicts. Does not create or qualify a business or offer.
      security: [{ adminBearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [supplier_id, expected_revision]
              properties:
                supplier_id: { type: string, format: uuid }
                expected_revision: { type: integer, minimum: 1 }
      responses:
        '204': { description: Association established or already present. }
        '401': { description: Authentication required. }
        '403': { description: Installation access required. }
        '409': { description: "Unknown reference, stale revision or attempted reassignment." }
