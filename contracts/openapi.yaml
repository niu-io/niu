    $ref: './key-spending.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1spending-limit~1{currency}'
  /admin/v1/organizations/{organization}/projects/{project}/keys/{key}/spending-limit/{currency}/history:
    $ref: './key-spending.openapi.yaml#/paths/~1admin~1v1~1organizations~1{organization}~1projects~1{project}~1keys~1{key}~1spending-limit~1{currency}~1history'
