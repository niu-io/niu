      description: Initial ark-direct-v1 adapter with configured video schema. Personal routes are owner-funded. Customer-funded routes require an effective customer selling card, current qualified Supplier offer, exact route/schema, effective resolution and supported video_tokens meter; reserve qualified maximum liability before dispatch. Active workspace budgets fail closed until video budget reservation is supported. Media references, callbacks and required content inspection remain unavailable. Commits authorization and dispatch intent before one POST; no automatic retry. Uncertainty returns the Niu reference and retains customer liability. Successful explicit queries settle reported customer usage once. Client abort is not cancellation/refund. Text-only creation supports an optional workspace-scoped Idempotency-Key. Same key and JSON document return the original reference and saved status; changed input conflicts. Object field order is ignored. Concurrent and restarted retries never submit again; interrupted preparation can remain submission_unknown. Unkeyed creation is not idempotent. Live channel, result and complete recovery qualification remain pending.
