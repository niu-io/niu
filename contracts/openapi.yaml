          description: Paired outcome, exact cost, coverage and uncertainty report.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PairedExperimentReportV1'
        '400':
          description: Invalid dataset, mismatched trial, incomplete cost evidence, or budget limit exceeded.
        '401':
          description: Invalid or expired administrator/operator credential.
  /admin/v1/workspaces:
