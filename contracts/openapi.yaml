        task_id: { type: string, minLength: 1, maxLength: 200 }
        model_alias: { type: string, minLength: 1, maxLength: 200 }
        currency: { type: [string, 'null'], pattern: '^[A-Z]{3}$' }
        cash_nanos: { type: [string, 'null'], pattern: '^[0-9]+$' }
        api_equivalent_nanos: { type: [string, 'null'], pattern: '^[0-9]+$' }
