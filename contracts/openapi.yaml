          schema: { type: string, format: uuid }
        - name: project
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: after
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Data and nullable next_cursor. Monetary and token values are decimal strings. API-equivalent and cash charges remain distinct. Unsettled attempts are excluded; an empty page does not prove zero incurred cost. Traversal is a live view ordered by attempt UUID, not chronological or a snapshot.
        '401':
          description: Administrator authentication required.
        '400':
          description: Invalid path or query parameter.
  /api/v1/organizations/{organization}/projects/{project}/requests/export:
    get:
      operationId: exportWorkspaceRequests
      summary: Export filtered customer-safe request metadata as CSV
      description: Requires workspace read access. Uses one database statement for the filtered range, newest first by default, with the requested sort applied to the whole range. Excludes internal identifiers, payloads, credentials and Provider costs. Unknown values remain empty, exact quantities remain decimal text, and formula-like text is neutralized. Pagination parameters are rejected; more than 10000 matched requests fails without a partial download.
      security:
        - adminBearerAuth: []
      parameters:
        - name: http_status
          in: query
          description: Recorded delivery HTTP status, or unknown when absent; independent of Provider execution.
          schema: { type: string, pattern: '^(unknown|[1-5][0-9]{2})$' }
        - name: sort
          in: query
          description: Full-range order. Known latency/token values precede unknown values; time and ID break ties. Live traversal is not a cross-page snapshot.
          schema: { type: string, enum: [time_desc, time_asc, latency_desc, input_desc, output_desc], default: time_desc }
        - { name: organization, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: project, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: from_ms, in: query, schema: { type: integer, format: int64 } }
        - { name: to_ms, in: query, schema: { type: integer, format: int64 } }
        - { name: model_alias, in: query, schema: { type: string, minLength: 1, maxLength: 200 } }
        - { name: operation_id, in: query, description: Restrict to one operation within the authorized workspace., schema: { type: string, format: uuid } }
        - { name: key_id, in: query, schema: { type: string, format: uuid } }
        - name: status
          in: query
          description: recorded_failure selects persisted failure observations, including SSE errors under HTTP 200; delivery_failed retains HTTP-error semantics.
          schema: { type: string, enum: [not_sent, may_have_executed, confirmed_completed, confirmed_not_executed, output_withheld, delivery_failed, recorded_failure] }
      responses:
        '200':
          description: CSV attachment with no-store caching and meaningful customer fields only. Appended Cached input tokens and Reasoning output tokens columns contain exact reported subset counts; unknown counts are blank and explicit zero remains zero. Category counts do not establish billing rates or savings.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
            Content-Disposition: { schema: { type: string } }
          content:
            text/csv: { schema: { type: string } }
        '400': { description: Invalid filters or pagination parameters. }
        '401': { description: "Missing, invalid or inference-only credentials." }
        '403': { description: Administration credential cannot read this workspace. }
        '413': { description: More than 10000 requests match; narrow the filters. }
  /api/v1/organizations/{organization}/projects/{project}/requests:
    $ref: './generated/handler-operations.json#/paths/~1api~1v1~1organizations~1{organization}~1projects~1{project}~1requests'
  /api/v1/setup/default-workspace:
    $ref: './generated/handler-operations.json#/paths/~1api~1v1~1setup~1default-workspace'
  /api/v1/organizations/{organization}/projects/{project}/asset-group-intents:
    get:
      operationId: listAssetGroupRequests
      summary: Discover saved asset group creation requests
      description: Workspace-scoped local metadata only; no upstream query or asset-readiness claim. IDs and cursors are internal routing references and must not be displayed as labels. Expired and deleted request names are omitted as null. Provider bindings, credentials, fingerprints and procurement data are excluded.
      security:
        - adminBearerAuth: []
      parameters:
        - {name: organization, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: after, in: query, schema: {type: string, format: uuid}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 30}}
      responses:
        '200':
          description: Bounded page in routing-reference order; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [data, next_cursor]
                properties:
                  next_cursor: {type: [string, 'null'], format: uuid}
                  data:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      additionalProperties: false
                      required: [id, name, status, created_at, request_content_status]
                      properties:
                        id: {type: string, format: uuid}
                        name: {type: [string, 'null']}
                        status: {type: string, enum: [prepared, dispatching, uncertain, succeeded]}
                        created_at: {type: string, format: date-time}
                        request_content_status: {type: string, enum: [retained, deleted, expired]}
        '400': {description: "Invalid cursor, limit or query field." }
        '401': {description: Member or installation session required.}
        '403': {description: Workspace read permission required.}
        '404': {description: Workspace unavailable to this caller.}
  /api/v1/organizations/{organization}/projects/{project}/asset-group-intents/{intent}/request:
    get:
      operationId: getAssetGroupRequest
      summary: Read customer-safe asset request content and retention status
      description: Requires workspace read permission. Returns null for absent intents. Expired or deleted request content is hidden immediately. Account bindings, credential revisions, fingerprints and procurement data are excluded.
      security:
        - adminBearerAuth: []
      parameters:
        - {name: organization, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: intent, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Customer-safe detail or null; Cache-Control no-store.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: [object, 'null']
                    additionalProperties: false
                    required: [status, created_at, request_content_status, request, dispatch]
                    properties:
                      dispatch:
                        type: [object, 'null']
                        additionalProperties: false
                        required: [outcome, reason, duration_ms]
                        properties:
                          outcome: { type: string, enum: [succeeded, uncertain] }
                          reason: { type: [string, 'null'], enum: [invalid_configuration, destination_rejected, upstream_uncertain, timeout, null] }
                          duration_ms: { type: integer, minimum: 0, description: Measured transport interval; not an inferred upstream phase. }
                      status: {type: string, enum: [prepared, dispatching, uncertain, succeeded]}
                      created_at: {type: string, format: date-time}
                      request_content_status: {type: string, enum: [retained, deleted, expired]}
                      request:
                        type: [object, 'null']
                        additionalProperties: false
                        required: [name, description]
                        properties:
                          name: {type: string}
                          description: {type: [string, 'null']}
        '401': {description: Member or installation session required.}
        '403': {description: Workspace read permission required.}
        '404': {description: Workspace outside authorized scope.}
    delete:
      operationId: deleteAssetGroupRequest
      summary: Delete saved asset-creation request content
      description: Requires workspace write access. Erases active-database request content while preserving reconciliation metadata and an immutable deletion event. Repeated or absent intent deletion returns 204 without disclosing existence. Does not delete upstream assets, backups or credentials. Prepared intents cannot dispatch after content deletion; already dispatched intents remain reconciliation work.
      security:
        - adminBearerAuth: []
      parameters:
        - {name: organization, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: project, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: intent, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '204': {description: Content absent or erased; no response body.}
        '401': {description: Member or installation session required; inference keys are not accepted.}
        '403': {description: Workspace write permission required.}
        '404': {description: Workspace outside the authorized scope.}
