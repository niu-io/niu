                  assigned: { type: boolean, const: true }
        '400': { description: Invalid assignment input. }
        '401': { description: Authentication required. }
        '403': { description: Installation administrator required. }
        '409': { description: "Stale revision, different owner, existing model route pricing, commercial qualification or unavailable account." }
